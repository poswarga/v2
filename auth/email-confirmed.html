<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Email Terkonfirmasi - POS WARGA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #dc2626 0%, #16a34a 100%);
            min-height: 100vh;
        }
        
        .confirm-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.98);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #dc2626 0%, #16a34a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #dc2626 0%, #16a34a 100%);
        }
        
        .check-circle {
            animation: popIn 0.5s ease-out 0.2s both;
        }
        
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            60% {
                transform: scale(1.15);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        .checkmark-path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.6s ease-out 0.5s forwards;
        }
        
        @media (max-width: 768px) {
            a {
                min-height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    
    <div class="confirm-card w-full max-w-md rounded-2xl shadow-2xl p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="flex items-center justify-center gap-2 mb-3">
                <div class="w-12 h-12 bg-gradient-to-br from-red-600 to-green-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-newspaper text-white text-xl"></i>
                </div>
                <span class="text-2xl font-bold">
                    <span class="gradient-text">POS WARGA</span>
                </span>
            </div>
        </div>
        
        <!-- Success Icon -->
        <div class="flex justify-center mb-5">
            <div class="check-circle w-20 h-20 rounded-full bg-gradient-to-br from-green-100 to-green-200 flex items-center justify-center shadow-lg">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="22" fill="white" stroke="#16a34a" stroke-width="3"/>
                    <path class="checkmark-path" d="M14 24L21 31L34 17" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
        </div>
        
        <!-- Title & Message -->
        <div class="text-center mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-2">
                Email Berhasil Dikonfirmasi!
            </h2>
            <p class="text-gray-600 text-sm mb-1">
                Akun kamu sudah aktif dan siap digunakan.
            </p>
            <p class="text-gray-500 text-sm">
                Selamat bergabung di komunitas <span class="gradient-text font-bold">POS WARGA</span> 🎉
            </p>
        </div>
        
        <!-- Timer Display -->
        <div class="text-center mb-5">
            <div id="timerBox" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-blue-50 text-blue-700 font-medium text-sm transition-all">
                <i class="fas fa-circle-notch text-xs" style="animation: spin 2s linear infinite;"></i>
                <span id="timerText">Redirect ke login dalam 0:30</span>
            </div>
        </div>
        
        <!-- Login Button -->
        <a href="login.html" id="loginBtn" class="block w-full text-center bg-gradient-to-r from-red-600 to-green-600 text-white py-3.5 rounded-xl font-semibold hover:from-red-700 hover:to-green-700 transition shadow-lg">
            <i class="fas fa-sign-in-alt mr-2"></i>Login Sekarang
        </a>
        
        <!-- Back to Home -->
        <a href="../index.html" class="block text-center text-gray-500 text-sm mt-4 hover:text-red-600 transition">
            <i class="fas fa-arrow-left mr-1"></i>Kembali ke Beranda
        </a>
        
    </div>

    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        // === TIMER 30 DETIK MUNDUR KE LOGIN ===
        let timeLeft = 30;
        const timerText = document.getElementById('timerText');
        const timerBox = document.getElementById('timerBox');
        
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }
        
        function updateTimer() {
            timeLeft--;
            
            // Update display
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                timerText.textContent = 'Mengarahkan ke login...';
                timerBox.classList.remove('bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-600');
                timerBox.classList.add('bg-green-50', 'text-green-700');
                
                // Redirect ke login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
                
            } else if (timeLeft <= 5) {
                // Warning style saat 5 detik terakhir
                timerText.textContent = `Redirect ke login dalam ${formatTime(timeLeft)}`;
                timerBox.classList.remove('bg-blue-50', 'text-blue-700');
                timerBox.classList.add('bg-red-50', 'text-red-600');
                
            } else {
                timerText.textContent = `Redirect ke login dalam ${formatTime(timeLeft)}`;
            }
        }
        
        const countdownInterval = setInterval(updateTimer, 1000);
        
        // === RESET TIMER SAAT USER INTERAKSI (OPSIONAL) ===
        ['click', 'keypress', 'scroll', 'mousemove', 'touchstart'].forEach((event) => {
            document.addEventListener(event, () => {
                // Tidak reset timer, biarkan tetap mundur
                // User bisa klik tombol login kapan saja
            });
        });
    </script>

</body>
</html>
