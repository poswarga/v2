<!doctype html>
<html lang=id>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<title>Login - POS WARGA</title>
<script src=https://cdn.tailwindcss.com></script>
<link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css>
<script src=https://cdn.jsdelivr.net/npm/sweetalert2@11></script>
<style>body{background:linear-gradient(135deg,#dc2626 0,#16a34a 100%);min-height:100vh}.login-card{backdrop-filter:blur(10px);background:rgba(255,255,255,.98)}.gradient-text{background:linear-gradient(135deg,#dc2626 0,#16a34a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}@media (max-width:768px){button,input{min-height:48px;font-size:16px!important}}
</style>
</head>
<body class="flex items-center justify-center p-4">
<div class="login-card w-full max-w-md rounded-2xl shadow-2xl p-8">
<div class="text-center mb-6">
<div class="flex items-center justify-center gap-2 mb-3">
<div class="w-12 h-12 bg-gradient-to-br from-red-600 to-green-600 rounded-xl flex items-center justify-center shadow-lg">
<i class="fas fa-newspaper text-white text-xl"></i>
</div>
<span class="text-2xl font-bold">
<span class=gradient-text>POS WARGA</span>
</span>
</div>
<h2 class="text-2xl text-gray-800">Selamat Datang<br>
<span class="text-2xl font-bold text-gray-800">Mulailah Bersuara</span>
<span class="text-base" style="font-size:70%;"><br>Kisah kecil bisa berarti bagi banyak orang.<br>Mari menulis dan berbagi cerita<br> bersama Pos Warga.</span></h2>
<p class="text-gray-500 text-sm mt-1">Login untuk melanjutkan ke dashboard</p>
</div>
<form id=loginForm class=space-y-4>
<div>
<label class="block text-gray-700 font-medium mb-1.5">
<i class="fas fa-envelope text-red-500 mr-1"></i>Email
</label>
<input type=email id=email class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition" placeholder=nama@email.com required>
</div>
<div>
<label class="block text-gray-700 font-medium mb-1.5">
<i class="fas fa-lock text-red-500 mr-1"></i>Password
</label>
<div class=relative>
<input type=password id=password class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition" placeholder="Masukkan password" required>
<button type=button onclick=togglePassword() class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-600 transition">
<i class="far fa-eye"></i>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 text-sm text-gray-600">
<input type=checkbox id=rememberMe class="rounded border-gray-300 text-red-600 focus:ring-red-500">
Ingat saya
</label>
<a href=# class="text-sm text-red-600 hover:text-red-700 hover:underline transition">
Lupa password?<br>Hubungi / WA Admin
</a>
</div>
<button type=submit id=submitBtn class="w-full bg-gradient-to-r from-red-600 to-green-600 text-white py-3.5 rounded-xl font-semibold hover:from-red-700 hover:to-green-700 transition shadow-lg">
<i class="fas fa-sign-in-alt mr-2"></i>Login
</button>
</form>
<div class="relative my-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-300"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-3 bg-white text-gray-500">Belum punya akun?</span>
</div>
</div>
<a href=register.html class="block w-full text-center bg-white border-2 border-red-200 text-red-600 py-3 rounded-xl font-semibold hover:bg-red-50 transition">
<i class="fas fa-user-plus mr-2"></i>Daftar Akun Baru
</a>
<a href=../index.html class="block text-center text-gray-500 text-sm mt-4 hover:text-red-600 transition">
<i class="fas fa-arrow-left mr-1"></i>Kembali ke Beranda
</a>
<div id=message class="mt-4 text-center text-sm"></div>
<div id=idleTimer class="mt-2 text-center text-xs text-gray-400"></div>
</div>

</body>
</html>
