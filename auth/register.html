<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Daftar - POS WARGA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #dc2626 0%, #16a34a 100%);
            min-height: 100vh;
        }
        
        .register-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.98);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #dc2626 0%, #16a34a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        @media (max-width: 768px) {
            input, button {
                min-height: 48px;
                font-size: 16px !important;
            }
        }
        
        .password-toggle {
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .password-toggle:hover {
            color: #dc2626;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    
    <div class="register-card w-full max-w-md rounded-2xl shadow-2xl p-8">
        
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="flex items-center justify-center gap-2 mb-3">
                <div class="w-12 h-12 bg-gradient-to-br from-red-600 to-green-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-newspaper text-white text-xl"></i>
                </div>
                <span class="text-2xl font-bold">
                    <span class="gradient-text">POS WARGA</span>
                </span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Buat Akun Baru</h2>
            <p class="text-gray-500 text-sm mt-1">Bergabung dengan komunitas<br>POS WARGA<br>Menulis Berita & Belanja<br>Jurnalistik</p>
        </div>
        
        <!-- Form -->
        <form id="registerForm" class="space-y-4">
            
            <!-- Nama Lengkap -->
            <div>
                <label class="block text-gray-700 font-medium mb-1.5">
                    <i class="fas fa-user text-red-500 mr-1"></i>Nama Lengkap
                </label>
                <input type="text" id="fullName" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                       placeholder="Masukkan nama lengkap" required>
            </div>
            
            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-medium mb-1.5">
                    <i class="fas fa-envelope text-red-500 mr-1"></i>Email
                </label>
                <input type="email" id="email" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                       placeholder="nama@email.com" required>
            </div>
            
            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-medium mb-1.5">
                    <i class="fas fa-lock text-red-500 mr-1"></i>Password
                </label>
                <div class="relative">
                    <input type="password" id="password" 
                           class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                           placeholder="Minimal 6 karakter" required>
                    <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-600 transition">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <!-- Konfirmasi Password -->
            <div>
                <label class="block text-gray-700 font-medium mb-1.5">
                    <i class="fas fa-check-circle text-red-500 mr-1"></i>Konfirmasi Password
                </label>
                <div class="relative">
                    <input type="password" id="confirmPassword" 
                           class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                           placeholder="Ulangi password" required>
                    <button type="button" onclick="togglePassword('confirmPassword')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-600 transition">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <!-- Nomor WhatsApp -->
            <div>
                <label class="block text-gray-700 font-medium mb-1.5">
                    <i class="fab fa-whatsapp text-green-500 mr-1"></i>Nomor WhatsApp
                </label>
                <input type="tel" id="phone" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                       placeholder="08123456789" required>
            </div>
            
            <!-- Syarat & Ketentuan -->
            <div class="flex items-start gap-2">
                <input type="checkbox" id="agreeTerms" class="mt-1 rounded border-gray-300 text-red-600 focus:ring-red-500" required>
                <label for="agreeTerms" class="text-sm text-gray-600">
                    Saya setuju dengan <a href="https://poswarga.com/terms.html" class="text-red-600 hover:underline">Syarat & Ketentuan</a> dan 
                    <a href="https://poswarga.com/privacy.html" class="text-red-600 hover:underline">Kebijakan Privasi</a> POS WARGA
                </label>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-red-600 to-green-600 text-white py-3.5 rounded-xl font-semibold hover:from-red-700 hover:to-green-700 transition shadow-lg">
                <i class="fas fa-user-plus mr-2"></i>Daftar Sekarang
            </button>
        </form>
        
        <!-- Divider -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-3 bg-white text-gray-500">Sudah punya akun?</span>
            </div>
        </div>
        
        <!-- Login Link -->
        <a href="login.html" class="block w-full text-center bg-white border-2 border-red-200 text-red-600 py-3 rounded-xl font-semibold hover:bg-red-50 transition">
            <i class="fas fa-sign-in-alt mr-2"></i>Login ke Akun
        </a>
        
        <!-- Back to Home -->
        <a href="../index.html" class="block text-center text-gray-500 text-sm mt-4 hover:text-red-600 transition">
            <i class="fas fa-arrow-left mr-1"></i>Kembali ke Beranda
        </a>
        
        <!-- Message -->
        <div id="message" class="mt-4 text-center text-sm"></div>
        
        <!-- Idle Timer Info -->
        <div id="idleTimer" class="mt-2 text-center text-xs text-gray-400"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        // ==================== CONFIG LOADER (AMAN - NO HARDCODE) ====================
        const API_URL = 'https://api.poswarga.com/api/config';
        let cachedConfig = null;
        let supabase = null;
        
        async function loadConfig() {
            if (cachedConfig) return cachedConfig;
            
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                signal: AbortSignal.timeout(5000)
            });
            
            if (!response.ok) {
                throw new Error(`Server error (${response.status})`);
            }
            
            cachedConfig = await response.json();
            
            if (!cachedConfig.SUPABASE_URL || !cachedConfig.SUPABASE_ANON_KEY) {
                throw new Error('Konfigurasi server tidak lengkap');
            }
            
            console.log('✅ Config loaded from API');
            return cachedConfig;
        }
        
        async function initSupabase() {
            try {
                const config = await loadConfig();
                supabase = createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
                console.log("✅ Supabase connected");
                return supabase;
            } catch (err) {
                console.error("❌ Supabase init gagal:", err.message);
                supabase = null;
                throw err;
            }
        }
        
        // ==================== IDLE TIMER (90 DETIK) ====================
        let idleTimer;
        let countdownInterval;
        let timeLeft = 90;
        
        function startIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            if (countdownInterval) clearInterval(countdownInterval);
            
            timeLeft = 90;
            updateCountdownDisplay();
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                updateCountdownDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);
            
            idleTimer = setTimeout(() => {
                window.location.href = '../index.html';
            }, 90000);
        }
        
        function updateCountdownDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            const timerDiv = document.getElementById('idleTimer');
            if (timerDiv) {
                if (timeLeft <= 30) {
                    timerDiv.innerHTML = `<i class="far fa-clock mr-1 text-red-500"></i><span class="text-red-500">Halaman akan kembali ke Beranda dalam ${display}</span>`;
                } else {
                    timerDiv.innerHTML = `<i class="far fa-clock mr-1"></i>Halaman akan kembali ke Beranda dalam ${display}`;
                }
            }
        }
        
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            clearInterval(countdownInterval);
            startIdleTimer();
        }
        
        ['click', 'keypress', 'scroll', 'mousemove', 'touchstart'].forEach(event => {
            document.addEventListener(event, resetIdleTimer);
        });
        
        // ==================== TOGGLE PASSWORD ====================
        window.togglePassword = function(fieldId) {
            const field = document.getElementById(fieldId);
            const button = field.parentElement.querySelector('button');
            const icon = button.querySelector('i');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };
        
        // ==================== HANDLE REGISTRATION ====================
        document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!supabase) {
                showMessage('❌ Tidak dapat terhubung ke server. Silakan refresh halaman.', 'error');
                return;
            }
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const submitBtn = document.getElementById('submitBtn');
            
            if (!fullName) {
                showMessage('❌ Nama lengkap wajib diisi', 'error');
                return;
            }
            
            if (!email) {
                showMessage('❌ Email wajib diisi', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('❌ Password minimal 6 karakter', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('❌ Konfirmasi password tidak cocok', 'error');
                return;
            }
            
            if (!agreeTerms) {
                showMessage('❌ Anda harus menyetujui Syarat & Ketentuan', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Memproses...';
            showMessage('<i class="fas fa-spinner fa-spin mr-1"></i>Memproses pendaftaran...', 'info');
            
            try {
                console.log('📝 Starting registration for:', email);
                
                const { data: authData, error: signUpError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone,
                            role: 'user'
                        }
                    }
                });
                
                if (signUpError) {
                    if (signUpError.message.includes('already registered')) {
                        throw new Error('Email sudah terdaftar. Silakan login.');
                    }
                    throw signUpError;
                }
                
                console.log('✅ Auth signup successful, user ID:', authData.user?.id);
                
                if (authData.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .upsert({
                            id: authData.user.id,
                            full_name: fullName,
                            email: email,
                            phone: phone || null,
                            role: 'user',
                            is_active: true,
                            created_at: new Date().toISOString()
                        }, {
                            onConflict: 'id'
                        });
                    
                    if (profileError) {
                        console.error('⚠️ Gagal insert ke profiles:', profileError);
                    } else {
                        console.log('✅ Profile created in profiles table');
                    }
                }
                
                clearTimeout(idleTimer);
                clearInterval(countdownInterval);
                
                showMessage('✅ Pendaftaran berhasil! Mengalihkan...', 'success');
                
                await Swal.fire({
                    icon: 'success',
                    title: 'Pendaftaran Berhasil!',
                    html: `
                        <p class="mb-2">Akun Anda telah dibuat.</p>
                        <p class="text-sm text-gray-600">Nama: <strong>${fullName}</strong></p>
                        <p class="text-sm text-gray-600">Email: <strong>${email}</strong></p>
                        <p class="text-sm text-gray-600">Phone: <strong>${phone || '-'}</strong></p>
                    `,
                    confirmButtonColor: '#dc2626',
                    confirmButtonText: 'Ke Halaman Login'
                });
                
                window.location.href = 'login.html';
                
            } catch (error) {
                console.error('❌ Register error:', error);
                showMessage('❌ ' + error.message, 'error');
                
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Mendaftar',
                    text: error.message,
                    confirmButtonColor: '#dc2626'
                });
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Daftar Sekarang';
                
                resetIdleTimer();
            }
        });
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            if (type === 'error') {
                messageDiv.style.color = '#dc2626';
            } else if (type === 'success') {
                messageDiv.style.color = '#059669';
            } else {
                messageDiv.style.color = '#6b7280';
            }
            messageDiv.innerHTML = msg;
        }
        
        // ==================== INIT ====================
        async function init() {
            try {
                await initSupabase();
            } catch (error) {
                console.error('Init error:', error.message);
                showMessage('❌ Gagal menghubungkan ke server. Silakan refresh halaman.', 'error');
                return;
            }
            
            startIdleTimer();
        }
        
        init();
    </script>
</body>
</html>
