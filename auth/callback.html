<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let supabase = null;
        
        async function initSupabase() {
            try {
                const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const c = await r.json();
                if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
                supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
            } catch(e) {
                console.error('Gagal inisialisasi Supabase:', e.message);
            }
        }

        async function handleCallback() {
            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');
            
            await initSupabase();
            
            if (!supabase) {
                loadingDiv.style.display = 'none';
                messageDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Gagal terhubung ke server. Silakan coba lagi.</div>`;
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            
            const hash = window.location.hash.substring(1);
            
            if (!hash) {
                const params = new URLSearchParams(window.location.search);
                const accessToken = params.get('access_token');
                if (accessToken) { await processToken(accessToken, params.get('refresh_token')); return; }
                loadingDiv.style.display = 'none';
                messageDiv.innerHTML = `<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">⚠️ Tidak ada token verifikasi. Silakan login.</div>`;
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                return;
            }
            
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const type = params.get('type');
            
            if (type === 'signup' || type === 'email_confirmation') {
                if (accessToken) { await processToken(accessToken, refreshToken); }
                else { loadingDiv.style.display = 'none'; messageDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Token tidak ditemukan. Link mungkin sudah kadaluarsa.</div>`; }
            } else {
                loadingDiv.style.display = 'none';
                messageDiv.innerHTML = `<div class="bg-gray-100 border border-gray-400 text-gray-700 px-4 py-3 rounded">🔄 Mengarahkan ke login...</div>`;
                setTimeout(() => { window.location.href = 'login.html'; }, 1000);
            }
        }
        
        async function processToken(accessToken, refreshToken) {
            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');
            
            try {
                const { data, error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
                if (error) throw error;
                
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
                
                loadingDiv.style.display = 'none';
                messageDiv.innerHTML = `<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">✅ Email berhasil diverifikasi! Mengarahkan ke dashboard...</div>`;
                
                setTimeout(() => {
                    const dash = profile?.role === 'admin' ? '../admin/dashboard.html' : profile?.role === 'editor' ? '../editor/dashboard.html' : profile?.role === 'member' ? '../member/dashboard.html' : '../user/dashboard.html';
                    window.location.href = dash;
                }, 2000);
                
            } catch (error) {
                loadingDiv.style.display = 'none';
                messageDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Verifikasi gagal: ${error.message}</div>`;
                setTimeout(() => { window.location.href = 'login.html'; }, 3000);
            }
        }
        
        handleCallback();
    </script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 text-center">
            <h2 class="text-2xl font-bold mb-4">Verifikasi Email</h2>
            <div id="loading" class="text-gray-600"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div><p>Memproses verifikasi...</p></div>
            <div id="message"></div>
        </div>
    </div>
</body>
</html>
