<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Artikel Saya - Editor POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .article-row:hover { background: linear-gradient(to right, #ecfdf5, #d1fae5); }
        .filter-chip { @apply px-3 py-1.5 rounded-full text-xs bg-gray-100 text-gray-600 hover:bg-green-100 hover:text-green-600 transition cursor-pointer; }
        .filter-chip.active { @apply bg-green-600 text-white; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <nav class="bg-white shadow-lg sticky top-0 z-20 border-b border-gray-100">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <a href="dashboard.html" class="text-gray-600 hover:text-green-600 transition p-2 rounded-lg hover:bg-green-50"><i class="fas fa-arrow-left"></i></a>
                    <div class="w-10 h-10 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl flex items-center justify-center shadow-md"><i class="fas fa-list text-white text-sm"></i></div>
                    <div><h1 class="text-xl font-bold bg-gradient-to-r from-green-600 to-emerald-800 bg-clip-text text-transparent">Artikel Saya</h1><p class="text-xs text-gray-400 hidden sm:block">Kelola semua artikel Anda</p></div>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <a href="create-article.html" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-4 py-2 rounded-lg text-sm transition shadow-md hover:from-green-600 hover:to-emerald-700"><i class="fas fa-plus mr-1"></i> Tulis Artikel</a>
                    <div class="text-right hidden sm:block"><p id="userName" class="text-sm font-semibold text-gray-800">Editor</p><p id="userEmail" class="text-xs text-gray-500">-</p></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-white rounded-xl shadow-md p-3 border border-gray-100 cursor-pointer hover:shadow-lg transition" onclick="filterByStatus('all')"><p class="text-xs text-gray-500">Semua</p><p class="text-xl font-bold text-gray-800" id="statAll">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 border border-gray-100 cursor-pointer hover:shadow-lg transition" onclick="filterByStatus('draft')"><p class="text-xs text-gray-500">Draft</p><p class="text-xl font-bold text-gray-600" id="statDraft">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 border border-gray-100 cursor-pointer hover:shadow-lg transition" onclick="filterByStatus('published')"><p class="text-xs text-gray-500">Published</p><p class="text-xl font-bold text-green-600" id="statPublished">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 border border-gray-100 cursor-pointer hover:shadow-lg transition" onclick="filterByStatus('archived')"><p class="text-xs text-gray-500">Arsip</p><p class="text-xl font-bold text-gray-500" id="statArchived">0</p></div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 mb-6 border border-gray-100">
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2"><span class="filter-chip active" data-status="all">Semua</span><span class="filter-chip" data-status="draft">Draft</span><span class="filter-chip" data-status="published">Published</span><span class="filter-chip" data-status="archived">Arsip</span></div>
                <button onclick="refreshData()" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg transition"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
            <div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50 border-b border-gray-100"><tr><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Judul</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Status</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Featured</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Tanggal</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Aksi</th></tr></thead><tbody id="articleTableBody"><tr><td colspan="5" class="text-center py-8 text-gray-500">Memuat...</td></tr></tbody></table></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 hidden"><span id="toastMessage"></span></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let cachedConfig = null, supabase = null;
        async function loadConfig() { 
            if (cachedConfig) return cachedConfig; 
            const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
            if (!r.ok) throw new Error(`Server error (${r.status})`);
            cachedConfig = await r.json();
            if (!cachedConfig.SUPABASE_URL || !cachedConfig.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            return cachedConfig; 
        }
        async function initSupabase() { try { const c = await loadConfig(); supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY); } catch (e) { supabase = null; throw e; } }
        
        let userId = null, articles = [], currentStatus = 'all';
        
        async function checkUser() {
            if (!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '../auth/login.html'; return; }
            const { data: p } = await supabase.from('profiles').select('role, full_name').eq('id', session.user.id).single();
            if (p?.role !== 'editor') { window.location.href = p?.role === 'admin' ? '../admin/dashboard.html' : p?.role === 'member' ? '../member/dashboard.html' : '../user/dashboard.html'; return; }
            userId = session.user.id;
            document.getElementById('userName').textContent = p?.full_name || session.user.email;
            document.getElementById('userEmail').textContent = session.user.email;
            loadArticles();
        }
        
        async function loadArticles() {
            const { data, error } = await supabase.from('article_index').select('id, title, slug, status, is_featured, created_at').eq('author_id', userId).eq('author_role', 'editor').order('created_at', { ascending: false });
            if (error) { showToast('Gagal memuat artikel', 'error'); return; }
            articles = data || []; updateStats(); renderArticles();
        }
        
        function updateStats() {
            document.getElementById('statAll').textContent = articles.length;
            document.getElementById('statDraft').textContent = articles.filter(a => a.status === 'draft').length;
            document.getElementById('statPublished').textContent = articles.filter(a => a.status === 'published').length;
            document.getElementById('statArchived').textContent = articles.filter(a => a.status === 'archived').length;
        }
        
        function renderArticles() {
            const tbody = document.getElementById('articleTableBody');
            let filtered = currentStatus === 'all' ? articles : articles.filter(a => a.status === currentStatus);
            if (!filtered.length) { tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12"><i class="fas fa-newspaper text-4xl text-gray-300 mb-3"></i><p>Tidak ada artikel</p><a href="create-article.html" class="inline-block mt-3 text-green-600 text-sm"><i class="fas fa-plus mr-1"></i>Tulis sekarang</a></td></tr>`; return; }
            tbody.innerHTML = filtered.map(a => {
                const d = new Date(a.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const isDraft = a.status === 'draft', isPublished = a.status === 'published', isArchived = a.status === 'archived';
                let act = '';
                if (isArchived) act = `<a href="edit-article.html?id=${a.id}" class="text-green-600 p-2"><i class="fas fa-edit"></i></a><button onclick="publishAgain('${a.id}')" class="text-blue-600 p-2"><i class="fas fa-globe"></i></button>`;
                else if (isPublished) act = `<a href="https://postingan.poswarga.com/posts/l?slug=${a.slug}" target="_blank" class="text-blue-600 p-2"><i class="fas fa-eye"></i></a><a href="edit-article.html?id=${a.id}" class="text-green-600 p-2"><i class="fas fa-edit"></i></a><button onclick="archiveArticle('${a.id}')" class="text-gray-600 p-2"><i class="fas fa-archive"></i></button>${a.is_featured ? `<button onclick="setFeatured('${a.id}',false)" class="text-yellow-500 p-2"><i class="fas fa-star"></i></button>` : `<button onclick="setFeatured('${a.id}',true)" class="text-gray-400 p-2"><i class="far fa-star"></i></button>`}`;
                else act = `<a href="edit-article.html?id=${a.id}" class="text-green-600 p-2"><i class="fas fa-edit"></i></a>`;
                return `<tr class="border-b hover:bg-green-50"><td class="py-3 px-4"><p class="font-medium">${escapeHtml(a.title)||'Tanpa Judul'}</p></td><td class="py-3 px-4">${getStatusBadge(a.status)}</td><td class="py-3 px-4">${a.is_featured?'<span class="text-yellow-500"><i class="fas fa-star"></i> Featured</span>':'<span class="text-gray-400">-</span>'}</td><td class="py-3 px-4 text-sm">${d}</td><td class="py-3 px-4"><div class="flex gap-1">${act}</div></td></tr>`;
            }).join('');
        }
        
        function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) : ''; }
        function getStatusBadge(s) { const b={draft:'bg-gray-100 text-gray-800',published:'bg-green-100 text-green-800',archived:'bg-gray-200 text-gray-600'}, l={draft:'Draft',published:'Published',archived:'Arsip'}; return `<span class="px-2 py-1 rounded-full text-xs font-medium ${b[s]||b.draft}">${l[s]||'Draft'}</span>`; }
        
        window.filterByStatus = (s) => { currentStatus = s; document.querySelectorAll('[data-status]').forEach(c => c.classList.toggle('active', c.dataset.status === s)); renderArticles(); };
        document.querySelectorAll('[data-status]').forEach(c => c.addEventListener('click', () => filterByStatus(c.dataset.status)));
        
        window.archiveArticle = async (id) => { if(!confirm('Arsipkan?')) return; await supabase.from('article_index').update({ status:'archived', archived_at:new Date().toISOString(), updated_at:new Date().toISOString() }).eq('id',id); showToast('Diarsipkan'); loadArticles(); };
        window.publishAgain = async (id) => { if(!confirm('Publish ulang?')) return; await supabase.from('article_index').update({ status:'published', published_at:new Date().toISOString(), archived_at:null, updated_at:new Date().toISOString() }).eq('id',id); showToast('✅ Dipublish ulang!'); loadArticles(); };
        window.setFeatured = async (id, f) => { await supabase.from('article_index').update({ is_featured:f, updated_at:new Date().toISOString() }).eq('id',id); showToast(f?'✅ Featured!':'⭐ Dihapus'); loadArticles(); };
        
        function showToast(m, t='success') { const toast = document.getElementById('toast'), msg = document.getElementById('toastMessage'); toast.classList.remove('bg-green-500','bg-red-500','bg-yellow-500'); toast.classList.add(t==='success'?'bg-green-500':t==='error'?'bg-red-500':'bg-yellow-500'); msg.textContent = m; toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 3000); }
        window.refreshData = async () => { const b = event.target.closest('button'), i = b.querySelector('i'); i.classList.add('fa-spin'); await loadArticles(); i.classList.remove('fa-spin'); showToast('Diperbarui'); };
        window.logout = async () => { if(supabase) await supabase.auth.signOut(); window.location.href = '../auth/login.html'; };
        
        (async () => { try { await initSupabase(); } catch(e) { window.location.href = '../auth/login.html'; return; } if(supabase) checkUser(); else window.location.href = '../auth/login.html'; })();
    </script>
</body>
</html>
