<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Review Artikel - Editor POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/article-chat.css">
    <style>
        .prose img { max-width: 100%; height: auto; border-radius: 8px; margin: 16px 0; }
        .prose h1, .prose h2, .prose h3 { margin-top: 24px; margin-bottom: 12px; font-weight: 600; }
        
        /* ===== ENHANCED: SPACING SYNC dengan Editor Quill & Publish ===== */
        .prose p { margin-bottom: 1.25em; line-height: 1.8; }
        .prose p:last-child { margin-bottom: 0; }
        .prose br + br { display: none; }
        .prose h1 { margin: 1.5em 0 0.75em; line-height: 1.3; font-size: 1.5em; font-weight: 700; }
        .prose h2 { margin: 1.25em 0 0.5em; line-height: 1.4; font-size: 1.25em; font-weight: 600; }
        .prose ul, .prose ol { margin: 0 0 1.25em 2em; padding-left: 0; }
        .prose li { margin-bottom: 0.5em; line-height: 1.7; }
        .prose li:last-child { margin-bottom: 0; }
        .prose blockquote { 
            border-left: 4px solid #10b981; 
            padding: 0.75em 1.25em; 
            margin: 1.25em 0; 
            color: #4b5563; 
            font-style: italic; 
            background: #ecfdf5;
            border-radius: 0 8px 8px 0;
        }
        .prose pre {
            margin: 1.25em 0;
            padding: 1em;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        .image-caption { font-size: 0.875rem; color: #6b7280; text-align: center; margin-top: 0.5rem; font-style: italic; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg sticky top-0 z-20 border-b border-gray-100">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <a href="../index.html" class="text-gray-500 hover:text-green-600 transition p-2 rounded-lg hover:bg-green-50" title="Beranda">
                        <i class="fas fa-home text-lg"></i>
                    </a>
                    <a href="dashboard.html" class="text-gray-500 hover:text-green-600 transition p-2 rounded-lg hover:bg-green-50" title="Dashboard Editor">
                        <i class="fas fa-tachometer-alt text-lg"></i>
                    </a>
                    <button onclick="window.location.reload()" class="text-gray-500 hover:text-green-600 transition p-2 rounded-lg hover:bg-green-50" title="Refresh Halaman">
                        <i class="fas fa-sync-alt text-lg"></i>
                    </button>
                    <div class="w-10 h-10 bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl flex items-center justify-center shadow-md">
                        <i class="fas fa-check-double text-white text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-green-600 to-emerald-800 bg-clip-text text-transparent">Review Artikel</h1>
                        <p class="text-xs text-gray-400 hidden sm:block">Review & publikasi artikel</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span id="editorName" class="text-sm font-semibold text-gray-700 hidden sm:inline"></span>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition shadow-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Kolom Kiri - Konten Artikel -->
            <div class="lg:col-span-2 space-y-4">
                <div id="articleContent" class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
                    <div class="text-center py-8">
                        <i class="fas fa-spinner fa-spin text-green-600 text-3xl mb-3"></i>
                        <p class="text-gray-500">Memuat artikel...</p>
                    </div>
                </div>
                
                <!-- Widget Chat Editor ↔ Penulis -->
                <div id="articleChatWidget"></div>
            </div>

            <!-- Kolom Kanan - Sidebar -->
            <div class="space-y-4">
                <!-- Info Artikel -->
                <div class="bg-white rounded-xl shadow-md p-5 border border-gray-100">
                    <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-info-circle text-green-600"></i> Info Artikel
                    </h3>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Status:</span>
                            <span id="infoStatus" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Penulis:</span>
                            <span id="infoAuthor" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Role:</span>
                            <span id="infoRole" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Kategori:</span>
                            <span id="infoCategory" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Dibuat:</span>
                            <span id="infoCreated" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Slug:</span>
                            <span id="infoSlug" class="font-medium font-mono text-xs truncate max-w-[150px]">-</span>
                        </div>
                    </div>
                </div>

                <!-- Statistik -->
                <div class="bg-white rounded-xl shadow-md p-5 border border-gray-100">
                    <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-chart-bar text-green-600"></i> Statistik
                    </h3>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Jumlah Kata:</span>
                            <span id="infoWordCount" class="font-medium">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Karakter:</span>
                            <span id="infoCharCount" class="font-medium">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Gambar:</span>
                            <span id="infoHasImage" class="font-medium">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Sumber:</span>
                            <span id="infoHasSource" class="font-medium">-</span>
                        </div>
                    </div>
                </div>

                <!-- Aksi Redaktur -->
                <div class="bg-white rounded-xl shadow-md p-5 border border-gray-100">
                    <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-tasks text-green-600"></i> Aksi Redaktur
                    </h3>
                    <div class="space-y-3">
                        <a href="#" id="editBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-md">
                            <i class="fas fa-edit"></i> Edit Artikel
                        </a>
                        
                        <div class="relative my-3">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-200"></div>
                            </div>
                            <div class="relative flex justify-center text-xs uppercase">
                                <span class="bg-white px-2 text-gray-400">Catatan Editor</span>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Catatan <span class="text-xs text-gray-400">(wajib untuk tolak)</span>
                            </label>
                            <textarea id="reviewNote" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 transition" rows="3" placeholder="Masukkan catatan untuk penulis..."></textarea>
                        </div>
                        
                        <div class="flex flex-col gap-2 pt-2">
                            <button onclick="approveArticle()" id="approveBtn" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-md">
                                <i class="fas fa-check-circle"></i> Approve & Publish
                            </button>
                            <button onclick="rejectArticle()" id="rejectBtn" class="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-md">
                                <i class="fas fa-times-circle"></i> Tolak Artikel
                            </button>
                            <hr class="border-gray-200">
                            <a href="dashboard.html" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 border border-gray-200">
                                <i class="fas fa-arrow-left"></i> Kembali ke Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Konfirmasi -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4 p-6">
            <h3 class="text-lg font-bold mb-4" id="modalTitle">Konfirmasi</h3>
            <p class="text-sm text-gray-600 mb-4" id="modalMessage">Apakah Anda yakin?</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Batal</button>
                <button onclick="confirmAction()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition shadow-md" id="modalConfirmBtn">Ya</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 hidden transition-all">
        <span id="toastMessage"></span>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let cachedConfig = null, supabase = null, editorName = '';
        
        async function loadConfig() {
            if (cachedConfig) return cachedConfig;
            const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
            if (!r.ok) throw new Error(`Server error (${r.status})`);
            cachedConfig = await r.json();
            if (!cachedConfig.SUPABASE_URL || !cachedConfig.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            return cachedConfig;
        }
        
        async function initSupabase() { 
            try { 
                const c = await loadConfig(); 
                supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY); 
                window.supabase = supabase; 
                console.log("✅ Supabase connected (editor)");
            } catch(e) { 
                supabase = null; 
                throw e; 
            } 
        }

        const articleId = new URLSearchParams(window.location.search).get('id');
        let article = null, pendingAction = null, currentUser = null;

        async function checkUser() {
            if (!supabase) { window.location.href = '../auth/login.html'; return false; }
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '../auth/login.html'; return false; }
            
            const { data: p, error } = await supabase
                .from('profiles')
                .select('role, full_name')
                .eq('id', session.user.id)
                .single();
            
            if (error || !p) {
                console.error('Gagal load profil editor:', error);
                window.location.href = '../auth/login.html';
                return false;
            }
            
            if (p?.role !== 'editor') { 
                if (p?.role === 'admin') window.location.href = '../admin/dashboard.html';
                else if (p?.role === 'member') window.location.href = '../member/dashboard.html';
                else window.location.href = '../user/dashboard.html';
                return false; 
            }
            
            currentUser = session.user;
            editorName = p?.full_name || session.user.email?.split('@')[0] || 'Editor';
            const editorNameEl = document.getElementById('editorName');
            if (editorNameEl) {
                editorNameEl.textContent = editorName;
                editorNameEl.setAttribute('data-user-name', editorName);
            }
            
            document.getElementById('editBtn').href = `edit-article.html?id=${articleId}`;
            
            console.log('✅ Editor logged in:', editorName);
            return true;
        }

        async function loadArticle() {
            if (!articleId) { 
                showToast('ID artikel tidak ditemukan', 'error'); 
                setTimeout(() => window.location.href = 'dashboard.html', 2000); 
                return; 
            }
            
            const { data, error } = await supabase
                .from('article_index')
                .select('*')
                .eq('id', articleId)
                .single();
                
            if (error || !data) { 
                document.getElementById('articleContent').innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-circle text-3xl mb-3"></i>
                        <p>Artikel tidak ditemukan</p>
                    </div>`; 
                return; 
            }
            
            if (data.status !== 'pending_editor') { 
                document.getElementById('articleContent').innerHTML = `
                    <div class="text-center py-8 text-yellow-600">
                        <i class="fas fa-exclamation-triangle text-3xl mb-3"></i>
                        <p>Status: <strong>${escapeHtml(data.status)}</strong> — tidak dapat direview</p>
                        <a href="dashboard.html" class="inline-block mt-3 text-green-600 hover:underline">← Kembali ke Dashboard</a>
                    </div>`; 
                return; 
            }
            
            article = data; 
            renderArticle(); 
            updateSidebarInfo(); 
            await initChatWidget();
        }

        function renderArticle() {
            const d = article.created_at 
                ? new Date(article.created_at).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) 
                : '-';
            
            let img = ''; 
            if (article.featured_image) {
                img = `<figure class="mb-6">
                    <img src="${article.featured_image}" alt="${escapeHtml(article.image_caption||'')}" class="w-full max-h-96 object-cover rounded-lg" onerror="this.style.display='none'">
                    ${article.image_caption ? `<figcaption class="image-caption">${escapeHtml(article.image_caption)}</figcaption>` : ''}
                </figure>`;
            }
            
            let src = ''; 
            if (article.source_url) {
                src = `<div class="mt-4 p-3 bg-blue-50 rounded-lg">
                    <p class="text-xs text-blue-700">
                        <i class="fas fa-link"></i> Sumber: 
                        <a href="${escapeHtml(article.source_url)}" target="_blank" rel="noopener noreferrer" class="hover:underline break-all">${escapeHtml(article.source_url)}</a>
                    </p>
                </div>`;
            }
            
            document.getElementById('articleContent').innerHTML = `
                <div class="mb-4 pb-4 border-b">
                    <h2 class="text-2xl md:text-3xl font-bold mb-3">${escapeHtml(article.title) || 'Tanpa Judul'}</h2>
                    <div class="flex flex-wrap gap-4 text-sm text-gray-600">
                        <span><i class="fas fa-user mr-1"></i>${escapeHtml(article.author_name) || 'Unknown'}</span>
                        <span><i class="fas fa-tag mr-1"></i>${article.author_role === 'member' ? 'Member ✨' : 'User'}</span>
                        <span><i class="fas fa-folder mr-1"></i>${escapeHtml(article.category) || '-'}</span>
                        <span><i class="fas fa-calendar mr-1"></i>${d}</span>
                    </div>
                </div>
                ${img}
                <div class="prose max-w-none">${article.content || '<p class="text-gray-500 italic">Tidak ada konten</p>'}</div>
                ${src}
                ${article.excerpt ? `
                    <div class="mt-6 p-4 bg-gray-50 rounded-lg border-l-4 border-green-500">
                        <p class="text-sm font-medium">📝 Excerpt:</p>
                        <p class="text-gray-600">${escapeHtml(article.excerpt)}</p>
                    </div>
                ` : ''}
            `;
        }

        function escapeHtml(s) { 
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); 
        }

        function updateSidebarInfo() {
            document.getElementById('infoStatus').className = 'px-2 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800';
            document.getElementById('infoStatus').textContent = 'Pending Editor';
            document.getElementById('infoAuthor').textContent = article.author_name || '-';
            document.getElementById('infoRole').textContent = article.author_role === 'member' ? 'Member ✨' : 'User';
            document.getElementById('infoCategory').textContent = article.category || '-';
            document.getElementById('infoCreated').textContent = article.created_at 
                ? new Date(article.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) 
                : '-';
            document.getElementById('infoSlug').textContent = article.slug || '-';
            
            const t = article.content?.replace(/<[^>]*>/g, ' ') || '';
            const wc = t.split(/\s+/).filter(w => w.length > 0).length;
            const cc = t.replace(/\s+/g, '').length;
            document.getElementById('infoWordCount').textContent = wc.toLocaleString();
            document.getElementById('infoCharCount').textContent = cc.toLocaleString();
            document.getElementById('infoHasImage').innerHTML = article.featured_image 
                ? '<span class="text-green-600">✅ Ada</span>' 
                : '<span class="text-red-400">❌ Tidak ada</span>';
            document.getElementById('infoHasSource').innerHTML = article.source_url 
                ? '<span class="text-green-600">✅ Ada</span>' 
                : '<span class="text-red-400">❌ Tidak ada</span>';
        }

        // ========== CHAT WIDGET ==========
        async function initChatWidget() {
            if (!articleId || !currentUser) {
                console.warn('initChatWidget: articleId atau currentUser tidak tersedia');
                return;
            }
            
            try {
                const widgetContainer = document.getElementById('articleChatWidget');
                if (!widgetContainer) {
                    console.warn('initChatWidget: #articleChatWidget tidak ditemukan');
                    return;
                }
                
                if (widgetContainer.querySelector('#articleChat')) {
                    console.log('initChatWidget: Widget sudah ada');
                    return;
                }
                
                console.log('initChatWidget: Memuat widget chat...');
                
                const response = await fetch('../shared/article-chat-widget.html');
                if (!response.ok) throw new Error('Gagal fetch widget template');
                const html = await response.text();
                
                widgetContainer.innerHTML = html;
                
                widgetContainer.style.opacity = '0';
                widgetContainer.style.transition = 'opacity 0.3s ease';
                requestAnimationFrame(() => { widgetContainer.style.opacity = '1'; });
                
                const script = document.createElement('script');
                script.src = '../assets/js/article-chat.js?v=20260501';
                script.onload = () => {
                    if (typeof ArticleChat !== 'undefined') {
                        console.log('initChatWidget: Membuat ArticleChat instance untuk editor');
                        const chat = new ArticleChat(articleId, currentUser.id, 'editor');
                        window._editorChat = chat;
                    } else {
                        console.error('initChatWidget: ArticleChat class tidak ditemukan');
                    }
                };
                script.onerror = () => console.error('initChatWidget: Gagal load article-chat.js');
                document.body.appendChild(script);
                
            } catch (e) {
                console.error('initChatWidget: Gagal load chat widget:', e);
            }
        }
        // ========== END CHAT WIDGET ==========

        window.approveArticle = () => { 
            pendingAction = 'approve'; 
            document.getElementById('modalTitle').textContent = '✅ Approve & Publish?'; 
            document.getElementById('modalMessage').textContent = 'Artikel akan langsung dipublish dan tampil di website.'; 
            document.getElementById('modalConfirmBtn').className = 'px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition'; 
            document.getElementById('modalConfirmBtn').innerHTML = '<i class="fas fa-check mr-1"></i> Approve'; 
            document.getElementById('confirmModal').classList.remove('hidden'); 
        };
        
        window.rejectArticle = () => { 
            const note = document.getElementById('reviewNote').value.trim();
            if (!note) {
                showToast('⚠️ Isi catatan alasan penolakan terlebih dahulu', 'error');
                document.getElementById('reviewNote').focus();
                return;
            }
            pendingAction = 'reject'; 
            document.getElementById('modalTitle').textContent = '❌ Tolak Artikel?'; 
            document.getElementById('modalMessage').textContent = 'Artikel akan dikembalikan ke penulis dengan catatan penolakan.'; 
            document.getElementById('modalConfirmBtn').className = 'px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition'; 
            document.getElementById('modalConfirmBtn').innerHTML = '<i class="fas fa-times mr-1"></i> Tolak'; 
            document.getElementById('confirmModal').classList.remove('hidden'); 
        };
        
        window.confirmAction = async () => { 
            if (pendingAction === 'approve') await doApprove(); 
            else if (pendingAction === 'reject') await doReject(); 
            closeModal(); 
        };

        async function doApprove() {
            const n = document.getElementById('reviewNote').value.trim(); 
            const b = document.getElementById('approveBtn'); 
            b.disabled = true; 
            b.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Mempublish...';
            
            try { 
                const { error } = await supabase
                    .from('article_index')
                    .update({
                        status: 'published',
                        editor_id: currentUser.id,
                        editor_note: n || null,
                        rejection_note: null,
                        published_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', articleId); 
                    
                if (error) throw error; 
                
                showToast('✅ Artikel berhasil dipublish!'); 
                setTimeout(() => window.location.href = 'dashboard.html', 1500); 
            } catch(e) { 
                showToast('❌ Gagal: ' + e.message, 'error'); 
                b.disabled = false; 
                b.innerHTML = '<i class="fas fa-check-circle"></i> Approve & Publish'; 
            }
        }

        async function doReject() {
            const n = document.getElementById('reviewNote').value.trim(); 
            const b = document.getElementById('rejectBtn'); 
            b.disabled = true; 
            b.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            
            try { 
                const { error } = await supabase
                    .from('article_index')
                    .update({
                        status: 'rejected',
                        editor_id: currentUser.id,
                        rejection_note: n,
                        editor_note: n,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', articleId); 
                    
                if (error) throw error; 
                
                showToast('❌ Artikel ditolak dan dikembalikan ke penulis'); 
                setTimeout(() => window.location.href = 'dashboard.html', 1500); 
            } catch(e) { 
                showToast('❌ Gagal: ' + e.message, 'error'); 
                b.disabled = false; 
                b.innerHTML = '<i class="fas fa-times-circle"></i> Tolak Artikel'; 
            }
        }

        window.closeModal = () => document.getElementById('confirmModal').classList.add('hidden');
        
        function showToast(m, t = 'success') { 
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage'); 
            toast.classList.remove('bg-green-500', 'bg-red-500', 'bg-yellow-500', 'bg-blue-500'); 
            if (t === 'success') toast.classList.add('bg-green-500');
            else if (t === 'error') toast.classList.add('bg-red-500');
            else if (t === 'info') toast.classList.add('bg-blue-500');
            else toast.classList.add('bg-yellow-500');
            msg.textContent = m; 
            toast.classList.remove('hidden'); 
            setTimeout(() => toast.classList.add('hidden'), 4000); 
        }
        
        window.showToastGlobal = showToast;
        
        window.logout = async () => { 
            if (supabase) await supabase.auth.signOut(); 
            window.location.href = '../auth/login.html'; 
        };

        document.addEventListener('keydown', e => { 
            if (e.key === 'Escape') closeModal(); 
        });
        
        document.getElementById('confirmModal').addEventListener('click', e => { 
            if (e.target === document.getElementById('confirmModal')) closeModal(); 
        });

        (async () => { 
            try { 
                await initSupabase(); 
            } catch(e) { 
                console.error('Gagal init Supabase:', e);
                window.location.href = '../auth/login.html'; 
                return; 
            }
            
            if (supabase && await checkUser()) {
                await loadArticle(); 
            } else {
                window.location.href = '../auth/login.html'; 
            }
        })();
    </script>
</body>
</html>
