<!-- shared/article-chat-widget.html -->
<div id="articleChat" class="article-chat-container" role="region" aria-label="Diskusi Artikel">
  <div class="chat-header">
    <h4 class="chat-title">
      <i class="fas fa-comments text-blue-500"></i>
      <span>Diskusi Artikel</span>
    </h4>
    <span class="chat-badge" id="chatBadge" style="display:none;">0</span>
  </div>
  
  <div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-label="Pesan percakapan">
    <!-- Loading state -->
    <div class="chat-loading" id="chatLoading">
      <i class="fas fa-spinner fa-spin"></i>
      <span>Memuat percakapan...</span>
    </div>
    
    <!-- Empty state (hidden by default, shown by JS) -->
    <div class="chat-empty" id="chatEmpty" style="display:none;">
      <div class="chat-empty-icon">
        <i class="fas fa-comment-dots"></i>
      </div>
      <p class="chat-empty-text">Belum ada percakapan</p>
      <p class="chat-empty-subtext">Kirim pesan pertama untuk memulai diskusi dengan editor.</p>
    </div>
    
    <!-- Error state (hidden by default, shown by JS) -->
    <div class="chat-error" id="chatError" style="display:none;">
      <i class="fas fa-exclamation-circle"></i>
      <span>Gagal memuat percakapan.</span>
      <button onclick="location.reload()" class="chat-retry-btn">Coba Lagi</button>
    </div>
    
    <!-- Messages will be rendered here by JS -->
    <div id="chatMessagesList"></div>
    
    <!-- Typing indicator (hidden by default) -->
    <div class="chat-typing" id="chatTyping" style="display:none;">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-text">sedang mengetik...</span>
    </div>
  </div>
  
  <form id="chatForm" class="chat-form" aria-label="Form kirim pesan">
    <div class="chat-input-wrapper">
      <textarea 
        id="chatInput" 
        class="chat-input" 
        placeholder="Tulis pesan Anda..." 
        rows="2"
        maxlength="2000"
        required
        aria-label="Pesan chat"
      ></textarea>
      <span class="chat-char-count" id="chatCharCount">0/2000</span>
    </div>
    <button type="submit" class="chat-send-btn" id="chatSendBtn" aria-label="Kirim pesan">
      <i class="fas fa-paper-plane"></i>
      <span class="chat-send-text">Kirim</span>
    </button>
  </form>
</div>
