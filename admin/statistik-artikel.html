<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Statistik Artikel - Admin POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .stat-card { transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .chart-container { position: relative; height: 300px; width: 100%; }
        @media (max-width: 768px) { .chart-container { height: 250px; } }
        .top-list-item { transition: all 0.2s ease; }
        .top-list-item:hover { background-color: #f8fafc; transform: translateX(4px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 10px; }
        .badge-emas { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .badge-perak { background: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%); color: white; }
        .badge-perunggu { background: linear-gradient(135deg, #d97706 0%, #92400e 100%); color: white; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <nav class="bg-white shadow-lg sticky top-0 z-20 border-b border-gray-100">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <a href="dashboard.html" class="text-gray-600 hover:text-blue-600 p-2 rounded-full hover:bg-blue-50 transition"><i class="fas fa-arrow-left text-xl"></i></a>
                    <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-blue-500 rounded-xl flex items-center justify-center shadow-md"><i class="fas fa-chart-bar text-white text-sm"></i></div>
                    <div><h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-blue-500 bg-clip-text text-transparent">Statistik Artikel</h1><p class="text-xs text-gray-400 hidden sm:block">Analisis Performa Konten</p></div>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <button onclick="refreshData()" id="refreshBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-lg text-sm transition"><i class="fas fa-sync-alt"></i></button>
                    <button onclick="exportData()" class="bg-green-100 hover:bg-green-200 text-green-700 p-2 rounded-lg text-sm transition"><i class="fas fa-download"></i></button>
                    <span id="adminEmail" class="text-gray-600 text-sm hidden sm:inline"></span>
                    <button onclick="logout()" class="bg-gradient-to-r from-red-500 to-red-600 text-white px-4 py-2 rounded-lg text-sm shadow-md"><i class="fas fa-sign-out-alt"></i><span class="hidden sm:inline ml-1">Logout</span></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6">
        <div class="bg-white rounded-xl shadow-md p-4 mb-6 border border-gray-100">
            <div class="flex flex-wrap items-center justify-between gap-4"><h2 class="text-lg font-semibold"><i class="fas fa-filter text-blue-600 mr-2"></i>Filter Periode</h2><div class="flex flex-wrap items-center gap-3"><div class="flex items-center gap-2"><label class="text-sm">Dari:</label><input type="date" id="dateFrom" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500"></div><div class="flex items-center gap-2"><label class="text-sm">Sampai:</label><input type="date" id="dateTo" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500"></div><button onclick="applyFilter()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700"><i class="fas fa-search mr-1"></i>Terapkan</button><button onclick="resetFilter()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-300"><i class="fas fa-undo-alt mr-1"></i>Reset</button></div></div>
            <div id="periodInfo" class="mt-3 text-sm text-gray-600 bg-blue-50 p-3 rounded-lg"><i class="fas fa-info-circle text-blue-600 mr-1"></i><span id="periodText">Menampilkan data 1 bulan terakhir</span></div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-4 mb-6">
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-file-alt text-gray-600"></i></div><div class="text-2xl font-bold" id="statTotal">0</div><div class="text-xs text-gray-500">Total</div></div>
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-check-circle text-green-600"></i></div><div class="text-2xl font-bold text-green-600" id="statPublished">0</div><div class="text-xs text-gray-500">Published</div></div>
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-yellow-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-clock text-yellow-600"></i></div><div class="text-2xl font-bold text-yellow-600" id="statPending">0</div><div class="text-xs text-gray-500">Pending</div></div>
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-pen text-purple-600"></i></div><div class="text-2xl font-bold text-purple-600" id="statDraft">0</div><div class="text-xs text-gray-500">Draft</div></div>
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-times-circle text-red-600"></i></div><div class="text-2xl font-bold text-red-600" id="statRejected">0</div><div class="text-xs text-gray-500">Rejected</div></div>
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-archive text-gray-600"></i></div><div class="text-2xl font-bold text-gray-600" id="statArchived">0</div><div class="text-xs text-gray-500">Archived</div></div>
            <div class="stat-card bg-white rounded-xl shadow-md p-4 text-center"><div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-eye text-blue-600"></i></div><div class="text-2xl font-bold text-blue-600" id="statViews">0</div><div class="text-xs text-gray-500">Views</div></div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-5 mb-6"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-line text-blue-600 mr-2"></i>Tren Publikasi</h3><div class="chart-container"><canvas id="monthlyChart"></canvas></div></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-md p-5"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-pie text-blue-600 mr-2"></i>Distribusi per Status</h3><div class="chart-container" style="height:250px"><canvas id="statusChart"></canvas></div></div>
            <div class="bg-white rounded-xl shadow-md p-5"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-tags text-blue-600 mr-2"></i>Top 12 Kategori</h3><div class="chart-container" style="height:250px"><canvas id="categoryChart"></canvas></div></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-md p-5"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-trophy text-yellow-500 mr-2"></i>Top 10 Artikel</h3><div class="space-y-2 max-h-96 overflow-y-auto" id="topArticlesList"></div></div>
            <div class="bg-white rounded-xl shadow-md p-5"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-medal text-blue-600 mr-2"></i>Top 10 Penulis</h3><div class="space-y-2 max-h-96 overflow-y-auto" id="topAuthorsList"></div><div class="mt-4 pt-3 border-t"><div class="flex flex-wrap gap-3 text-xs"><span class="flex items-center gap-1"><span class="w-4 h-4 rounded-full badge-perunggu"></span>≥4/bln</span><span class="flex items-center gap-1"><span class="w-4 h-4 rounded-full badge-perak"></span>≥3/mgg</span><span class="flex items-center gap-1"><span class="w-4 h-4 rounded-full badge-emas"></span>≥6/mgg</span></div></div></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let supabase = null, monthlyChart = null, statusChart = null, categoryChart = null;
        let dateFrom = null, dateTo = null;
        
        async function initSupabase() {
            const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const c = await r.json();
            if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
        }
        
        async function checkAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '../auth/login.html'; return false; }
            const { data: p } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (!p || p.role !== 'admin') { window.location.href = '../user/dashboard.html'; return false; }
            document.getElementById('adminEmail').textContent = session.user.email;
            return true;
        }
        
        async function loadStatsViaRPC() {
            const params = {};
            if (dateFrom) params.date_from = dateFrom.toISOString();
            if (dateTo) params.date_to = dateTo.toISOString();
            
            const { data: stats, error } = await supabase.rpc('get_article_stats', params);
            
            if (error) {
                console.error('RPC error:', error);
                Swal.fire({ icon: 'error', title: 'Gagal memuat statistik', text: error.message });
                return null;
            }
            
            return stats;
        }
        
        async function loadAuthorsWithBadges() {
            const params = {};
            if (dateFrom) params.date_from = dateFrom.toISOString();
            if (dateTo) params.date_to = dateTo.toISOString();
            
            const { data: authors, error } = await supabase.rpc('get_top_authors_with_badges', params);
            
            if (error) {
                console.error('RPC authors error:', error);
                return [];
            }
            
            return authors || [];
        }
        
        async function loadAllData() {
            const stats = await loadStatsViaRPC();
            if (!stats) return;
            
            updateStatCards(stats);
            updateMonthlyChart(stats.monthly || []);
            updateStatusChart(stats.status_distribution || {});
            await updateCategoryChart();
            updateTopArticlesList(stats.top_articles || []);
            
            const authors = await loadAuthorsWithBadges();
            updateTopAuthorsList(authors);
        }
        
        window.applyFilter = function() {
            const fi = document.getElementById('dateFrom').value, ti = document.getElementById('dateTo').value;
            dateFrom = fi ? new Date(fi) : null;
            dateTo = ti ? new Date(ti + 'T23:59:59') : null;
            updatePeriodInfo();
            loadAllData();
        };
        
        window.resetFilter = function() {
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            dateFrom = null;
            dateTo = null;
            updatePeriodInfo();
            loadAllData();
        };
        
        function updatePeriodInfo() {
            const t = document.getElementById('periodText');
            if (dateFrom && dateTo) t.textContent = `${dateFrom.toLocaleDateString('id-ID')} - ${dateTo.toLocaleDateString('id-ID')}`;
            else if (dateFrom) t.textContent = `Sejak ${dateFrom.toLocaleDateString('id-ID')}`;
            else if (dateTo) t.textContent = `Hingga ${dateTo.toLocaleDateString('id-ID')}`;
            else t.textContent = 'Semua data (seluruh periode)';
        }
        
        function updateStatCards(stats) {
            document.getElementById('statTotal').textContent = (stats.total || 0).toLocaleString();
            document.getElementById('statPublished').textContent = (stats.published || 0).toLocaleString();
            document.getElementById('statPending').textContent = (stats.pending || 0).toLocaleString();
            document.getElementById('statDraft').textContent = (stats.draft || 0).toLocaleString();
            document.getElementById('statRejected').textContent = (stats.rejected || 0).toLocaleString();
            document.getElementById('statArchived').textContent = (stats.archived || 0).toLocaleString();
            document.getElementById('statViews').textContent = (stats.views || 0).toLocaleString();
        }
        
        function updateMonthlyChart(monthlyData) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            
            let labels = [], counts = [];
            
            if (monthlyData && monthlyData.length > 0) {
                labels = monthlyData.map(m => m.month);
                counts = monthlyData.map(m => m.count);
            } else {
                const now = new Date();
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    labels.push(d.toLocaleDateString('id-ID', { month: 'short', year: 'numeric' }));
                    counts.push(0);
                }
            }
            
            if (monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Artikel',
                        data: counts,
                        borderColor: 'rgb(37,99,235)',
                        backgroundColor: 'rgba(37,99,235,0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }
        
        function updateStatusChart(distribution) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            const sc = {
                published: distribution.published || 0,
                pending: distribution.pending || 0,
                draft: distribution.draft || 0,
                rejected: distribution.rejected || 0,
                archived: distribution.archived || 0
            };
            
            if (statusChart) statusChart.destroy();
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Published', 'Pending', 'Draft', 'Rejected', 'Archived'],
                    datasets: [{
                        data: [sc.published, sc.pending, sc.draft, sc.rejected, sc.archived],
                        backgroundColor: ['#22c55e', '#eab308', '#a855f7', '#ef4444', '#6b7280']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });
        }
        
        async function updateCategoryChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            const POSWARGA_CATEGORIES = [
                'Kabar Gardu', 'Jejak Lapangan', 'Kisah Tetangga', 'Obrolan Warung',
                'Rembuk Warga', 'Sorot Publik', 'Balai Komunitas', 'Gerak Bareng',
                'Lapak Lokal', 'Cerita Ladang', 'Denyut Negeri', 'Gawe Kampung'
            ];
            
            const CATEGORY_COLORS = [
                '#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#22c55e',
                '#8b5cf6', '#f97316', '#ec4899', '#64748b', '#14b8a6', '#6366f1'
            ];
            
            let query = supabase.from('article_index').select('category').eq('status', 'published');
            if (dateFrom) query = query.gte('created_at', dateFrom.toISOString());
            if (dateTo) query = query.lte('created_at', dateTo.toISOString());
            
            const { data: articles } = await query;
            
            const categoryCount = {};
            POSWARGA_CATEGORIES.forEach(cat => { categoryCount[cat] = 0; });
            
            (articles || []).forEach(a => {
                if (a.category && categoryCount.hasOwnProperty(a.category)) {
                    categoryCount[a.category]++;
                }
            });
            
            const sorted = Object.entries(categoryCount)
                .filter(([_, count]) => count > 0)
                .sort((a, b) => b[1] - a[1]);
            
            const labels = sorted.map(x => x[0]);
            const data = sorted.map(x => x[1]);
            
            if (labels.length === 0) {
                labels.push(...POSWARGA_CATEGORIES);
                data.push(...Array(12).fill(0));
            }
            
            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: labels.map((_, i) => CATEGORY_COLORS[i % CATEGORY_COLORS.length])
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 }, padding: 8 } } }
                }
            });
        }
        
        function updateTopArticlesList(articles) {
            const c = document.getElementById('topArticlesList');
            
            if (!articles || !articles.length) {
                c.innerHTML = '<div class="text-center py-8 text-gray-400">Belum ada artikel</div>';
                return;
            }
            
            c.innerHTML = articles.map((a, i) => `
                <div class="top-list-item flex items-center gap-3 p-3 rounded-lg border">
                    <div class="w-8 h-8 ${i < 3 ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'} rounded-full flex items-center justify-center font-bold text-sm">${i + 1}</div>
                    <div class="flex-1">
                        <a href="https://postingan.poswarga.com/posts/${a.slug || ''}" target="_blank" class="font-medium hover:text-blue-600 truncate block">${escapeHtml(a.title || 'Tanpa Judul')}</a>
                        <p class="text-xs text-gray-500"><i class="fas fa-eye mr-1"></i>${(a.views || 0).toLocaleString()} views</p>
                    </div>
                </div>
            `).join('');
        }
        
        function updateTopAuthorsList(authors) {
            const c = document.getElementById('topAuthorsList');
            
            if (!authors || !authors.length) {
                c.innerHTML = '<div class="text-center py-8 text-gray-400">Belum ada data</div>';
                return;
            }
            
            const rb = {
                admin: '<span class="px-1.5 py-0.5 rounded text-xs bg-red-100 text-red-700">Admin</span>',
                editor: '<span class="px-1.5 py-0.5 rounded text-xs bg-indigo-100 text-indigo-700">Editor</span>',
                member: '<span class="px-1.5 py-0.5 rounded text-xs bg-green-100 text-green-700">Member</span>',
                user: '<span class="px-1.5 py-0.5 rounded text-xs bg-purple-100 text-purple-700">User</span>'
            };
            
            const badgeInfo = {
                emas: { icon: '🥇', label: 'Emas', class: 'badge-emas' },
                perak: { icon: '🥈', label: 'Perak', class: 'badge-perak' },
                perunggu: { icon: '🥉', label: 'Perunggu', class: 'badge-perunggu' }
            };
            
            c.innerHTML = authors.map((a, i) => {
                const bd = a.badge ? badgeInfo[a.badge] : null;
                return `
                    <div class="top-list-item flex items-center gap-3 p-3 rounded-lg border">
                        <div class="w-8 h-8 ${i < 3 ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'} rounded-full flex items-center justify-center font-bold text-sm">${i + 1}</div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-medium truncate">${escapeHtml(a.author_name || 'Unknown')}</span>
                                ${rb[a.author_role] || ''}
                                ${bd ? `<span class="px-1.5 py-0.5 rounded text-xs ${bd.class}">${bd.icon} ${bd.label}</span>` : ''}
                            </div>
                            <p class="text-xs text-gray-500">
                                <i class="fas fa-newspaper mr-1"></i>${a.article_count} artikel • 
                                <i class="fas fa-eye mr-1"></i>${(a.total_views || 0).toLocaleString()} views
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]) : ''; }
        
        window.exportData = () => Swal.fire({ title: 'Export', text: 'Fitur export segera hadir.', icon: 'info' });
        
        window.refreshData = async () => {
            const b = document.getElementById('refreshBtn'), i = b.querySelector('i');
            i.classList.add('fa-spin');
            b.disabled = true;
            await loadAllData();
            i.classList.remove('fa-spin');
            b.disabled = false;
            Swal.fire({ icon: 'success', title: 'Diperbarui', timer: 1000, showConfirmButton: false });
        };
        
        window.logout = async () => { await supabase.auth.signOut(); window.location.href = '../auth/login.html'; };
        
        function setDefaultDates() {
            const t = new Date(), m = new Date(t);
            m.setMonth(t.getMonth() - 1);
            document.getElementById('dateFrom').value = m.toISOString().split('T')[0];
            document.getElementById('dateTo').value = t.toISOString().split('T')[0];
            dateFrom = m;
            dateTo = t;
        }
        
        (async () => {
            try {
                await initSupabase();
            } catch(e) {
                window.location.href = '../auth/login.html';
                return;
            }
            if (!await checkAdmin()) return;
            setDefaultDates();
            updatePeriodInfo();
            await loadAllData();
        })();
    </script>
</body>
</html>
