<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Kelola Produk - Admin POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 md:p-6">

<div class="container mx-auto">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
        <h1 class="text-2xl font-bold text-blue-600"><i class="fas fa-box mr-2"></i>Kelola Produk</h1>
        <div class="flex gap-3">
            <a href="dashboard.html" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition flex items-center gap-2"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
            <button onclick="window.logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition flex items-center gap-2"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 id="formTitle" class="text-lg font-bold mb-4"><i class="fas fa-plus-circle mr-2 text-blue-600"></i>Tambah Produk Baru</h2>
        <form id="productForm">
            <div id="formMessage" class="mb-4"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-gray-700 mb-2">Nama Produk *</label><input type="text" id="productName" required class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-gray-700 mb-2">Harga (Rp) *</label><input type="number" id="productPrice" required class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-gray-700 mb-2">Stok</label><input type="number" id="productStock" value="0" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-gray-700 mb-2">Kategori</label><select id="productCategory" class="w-full border rounded-lg p-2"><option value="">Pilih Kategori</option><option value="kegiatan">Kegiatan</option><option value="kelengkapan">Kelengkapan</option><option value="souvenir">Souvenir</option></select></div>
                <div class="md:col-span-2"><label class="block text-gray-700 mb-2">Deskripsi</label><textarea id="productDescription" rows="3" class="w-full border rounded-lg p-2"></textarea></div>
                <div class="md:col-span-2"><label class="block text-gray-700 mb-2">URL Gambar</label><input type="url" id="productImage" placeholder="https://..." class="w-full border rounded-lg p-2"><p class="text-xs text-gray-400 mt-1">Masukkan URL gambar produk (opsional)</p></div>
            </div>
            <div class="mt-6 flex gap-3"><button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition"><i class="fas fa-save mr-1"></i> Simpan</button><button type="button" onclick="window.resetForm()" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition"><i class="fas fa-undo-alt mr-1"></i> Reset</button></div>
        </form>
    </div>
    
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="px-6 py-4 border-b flex justify-between items-center flex-wrap gap-3"><h2 class="text-xl font-bold"><i class="fas fa-list mr-2 text-blue-600"></i>Daftar Produk</h2><div class="text-xs text-gray-400"><i class="fas fa-info-circle"></i> Klik Hapus hanya untuk produk yang belum pernah dipesan</div></div>
        <div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50"><tr><th class="py-3 px-4 text-left text-sm">ID</th><th class="py-3 px-4 text-left text-sm">Gambar</th><th class="py-3 px-4 text-left text-sm">Nama</th><th class="py-3 px-4 text-left text-sm">Kategori</th><th class="py-3 px-4 text-left text-sm">Harga</th><th class="py-3 px-4 text-left text-sm">Stok</th><th class="py-3 px-4 text-left text-sm">Status</th><th class="py-3 px-4 text-left text-sm">Aksi</th></tr></thead><tbody id="productsTableBody"><tr><td colspan="8" class="text-center py-8"><div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div><span class="ml-2 text-gray-500">Memuat data...</span></td></tr></tbody></table></div>
    </div>
</div>

<div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4">
        <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold text-red-600"><i class="fas fa-exclamation-triangle mr-2"></i>Hapus Produk</h3><button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button></div>
        <p class="text-gray-600 mb-4">Yakin ingin menghapus produk <strong id="deleteProductName"></strong>?</p>
        <p class="text-xs text-red-500 mb-4">⚠️ Tindakan ini permanen!</p>
        <div class="flex gap-3"><button onclick="window.closeModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">Batal</button><button onclick="window.confirmDeleteProduct()" class="flex-1 bg-red-500 text-white py-2 rounded-lg hover:bg-red-600"><i class="fas fa-trash mr-1"></i> Ya, Hapus</button></div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    
    const API_URL = 'https://api.poswarga.com/api/config';
    let cachedConfig = null, supabase = null;
    
    async function loadConfig() {
        if (cachedConfig) return cachedConfig;
        const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
        if (!r.ok) throw new Error(`Server error (${r.status})`);
        cachedConfig = await r.json();
        if (!cachedConfig.SUPABASE_URL || !cachedConfig.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
        return cachedConfig;
    }
    
    async function initSupabase() { try { const c = await loadConfig(); supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY); return supabase; } catch(e) { supabase = null; throw e; } }
    
    async function requireAdmin() {
        if (!supabase) return null;
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '../auth/login.html'; return null; }
        const { data: p } = await supabase.from('profiles').select('role, full_name').eq('id', session.user.id).single();
        if (!p || p.role !== 'admin') { window.location.href = '../user/dashboard.html'; return null; }
        return session;
    }
    
    let currentEditId = null, currentProducts = [], productToDelete = null;

    function formatId(id) { if(!id)return'???'; const s=String(id); return s.length<=8?s:s.substring(0,8)+'...'; }
    function formatCategory(c) { const cats={kegiatan:'Kegiatan',kelengkapan:'Kelengkapan',souvenir:'Souvenir',website:'Website',optimasi:'Optimasi',aplikasi:'Aplikasi'}; return cats[c]||c||'-'; }

    async function init() {
        try { await initSupabase(); } catch(e) { window.location.href = '../auth/login.html'; return; }
        if (!supabase) { window.location.href = '../auth/login.html'; return; }
        const session = await requireAdmin();
        if (!session) { window.location.href = '../auth/login.html'; return; }
        await loadProducts();
    }
    
    async function loadProducts() {
        const tbody = document.getElementById('productsTableBody');
        if (!tbody) return;
        try {
            const { data: products, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            currentProducts = products || [];
            if (!currentProducts.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-500"><i class="fas fa-box-open mr-2"></i>Belum ada produk.</td></tr>'; return; }
            tbody.innerHTML = currentProducts.map(p => {
                const isActive = p.is_active !== false, img = p.image_url ? `<img src="${p.image_url}" class="w-10 h-10 object-cover rounded" onerror="this.style.display='none'">` : '<div class="w-10 h-10 bg-gray-100 rounded flex items-center justify-center"><i class="fas fa-image text-gray-400"></i></div>';
                return `<tr class="border-b hover:bg-gray-50 ${!isActive?'opacity-60':''}"><td class="py-3 px-4 text-xs font-mono">${formatId(p.id)}</td><td class="py-3 px-4">${img}</td><td class="py-3 px-4 font-medium">${escapeHtml(p.name||'Tanpa Nama')}</td><td class="py-3 px-4">${formatCategory(p.category)}</td><td class="py-3 px-4">Rp ${(p.price||0).toLocaleString()}</td><td class="py-3 px-4">${p.stock??0}</td><td class="py-3 px-4"><span class="px-2 py-1 rounded text-xs ${isActive?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}"><i class="fas ${isActive?'fa-check-circle':'fa-ban'} mr-1"></i>${isActive?'Aktif':'Nonaktif'}</span></td><td class="py-3 px-4 whitespace-nowrap"><button onclick="window.toggleStatus('${p.id}',${!isActive})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs mr-1 hover:bg-yellow-600"><i class="fas ${isActive?'fa-ban':'fa-check-circle'} mr-1"></i>${isActive?'Nonaktif':'Aktif'}</button><button onclick="window.editProduct('${p.id}')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs mr-1 hover:bg-blue-600"><i class="fas fa-edit mr-1"></i>Edit</button><button onclick="window.archiveProduct('${p.id}','${escapeHtml(p.name)}')" class="bg-gray-500 text-white px-2 py-1 rounded text-xs mr-1 hover:bg-gray-600"><i class="fas fa-archive mr-1"></i>Arsip</button><button onclick="window.showDeleteConfirm('${p.id}','${escapeHtml(p.name)}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600"><i class="fas fa-trash mr-1"></i>Hapus</button></td></tr>`;
            }).join('');
        } catch(e) { tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-500">Error: ${e.message}</td></tr>`; }
    }
    
    function escapeHtml(s) { return s?String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]):''; }
    function showMessage(m, t='success') { const d=document.getElementById('formMessage'); if(!d)return; d.innerHTML=`<div class="${t==='success'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} p-3 rounded-lg">${t==='success'?'✅':'❌'} ${m}</div>`; setTimeout(()=>{if(d)d.innerHTML='';},3000); }
    
    async function hasOrders(id) { try{const{data}=await supabase.from('order_items').select('id').eq('product_id',id).limit(1);return data&&data.length>0;}catch(e){return false;} }
    
    window.toggleStatus = async (id, ns) => { try{await supabase.from('products').update({is_active:ns}).eq('id',id);showMessage(`Produk ${ns?'diaktifkan':'dinonaktifkan'}`);await loadProducts();}catch(e){showMessage(e.message,'error');} };
    window.archiveProduct = async (id, name) => { if(!confirm(`Arsipkan "${name}"?`))return; try{await supabase.from('products').update({is_active:false,archived_at:new Date().toISOString()}).eq('id',id);showMessage(`📦 "${name}" diarsipkan`);await loadProducts();}catch(e){showMessage(e.message,'error');} };
    
    window.showDeleteConfirm = async (id, name) => { if(await hasOrders(id)){showMessage(`⚠️ "${name}" sudah dipesan! Gunakan Arsip.`,'error');return;} productToDelete={id,name}; const m=document.getElementById('deleteModal'),s=document.getElementById('deleteProductName'); if(m&&s){s.textContent=name;m.classList.remove('hidden');m.classList.add('flex');} };
    window.closeModal = () => { const m=document.getElementById('deleteModal'); if(m){m.classList.add('hidden');m.classList.remove('flex');} productToDelete=null; };
    window.confirmDeleteProduct = async () => { if(!productToDelete)return; try{await supabase.from('products').delete().eq('id',productToDelete.id);showMessage(`🗑️ "${productToDelete.name}" dihapus`);closeModal();await loadProducts();}catch(e){showMessage(e.message,'error');closeModal();} };
    
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('productName').value, price = parseInt(document.getElementById('productPrice').value), stock = parseInt(document.getElementById('productStock').value)||0, category = document.getElementById('productCategory').value, description = document.getElementById('productDescription').value, image_url = document.getElementById('productImage').value;
        if(!name||!price){showMessage('Nama dan harga wajib!','error');return;}
        try {
            if(currentEditId){await supabase.from('products').update({name,price,stock,category,description,image_url}).eq('id',currentEditId);showMessage('✅ Diupdate!');}
            else {await supabase.from('products').insert([{name,price,stock,category,description,image_url,is_active:true}]);showMessage('✅ Ditambahkan!');}
            window.resetForm(); await loadProducts();
        } catch(e) { showMessage(e.message,'error'); }
    });
    
    window.editProduct = (id) => { const p=currentProducts.find(x=>String(x.id)===String(id)); if(!p){showMessage('Tidak ditemukan','error');return;} currentEditId=p.id; document.getElementById('productName').value=p.name||''; document.getElementById('productPrice').value=p.price||''; document.getElementById('productStock').value=p.stock||0; document.getElementById('productCategory').value=p.category||''; document.getElementById('productDescription').value=p.description||''; document.getElementById('productImage').value=p.image_url||''; document.getElementById('formTitle').innerHTML='<i class="fas fa-edit mr-2 text-blue-600"></i>Edit Produk'; document.getElementById('productForm').scrollIntoView({behavior:'smooth'}); };
    window.resetForm = () => { document.getElementById('productForm').reset(); currentEditId=null; document.getElementById('formTitle').innerHTML='<i class="fas fa-plus-circle mr-2 text-blue-600"></i>Tambah Produk Baru'; document.getElementById('formMessage').innerHTML=''; };
    window.logout = async () => { if(supabase)await supabase.auth.signOut(); window.location.href='../auth/login.html'; };
    
    init();
</script>
</body>
</html>
