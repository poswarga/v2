    <style>
        .ql-editor { min-height: 350px; font-size: 16px; }
        .ql-container { font-size: 16px; }
        .ql-toolbar { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .ql-container { border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
        .action-btn { transition: all 0.2s ease; }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* ===== ENHANCED: SPACING SYNC (Create → Preview → Publish) ===== */
        .ql-editor p { margin-bottom: 1.25em; line-height: 1.8; }
        .ql-editor p:last-child { margin-bottom: 0; }
        .ql-editor br + br { display: none; }
        .ql-editor h1 { margin: 1.5em 0 0.75em; line-height: 1.3; font-size: 1.5em; font-weight: 700; }
        .ql-editor h2 { margin: 1.25em 0 0.5em; line-height: 1.4; font-size: 1.25em; font-weight: 600; }
        .ql-editor ol, .ql-editor ul { margin-bottom: 1.25em; padding-left: 2em; }
        .ql-editor li { margin-bottom: 0.5em; line-height: 1.7; }
        .ql-editor li:last-child { margin-bottom: 0; }
        .ql-editor blockquote { margin: 1.25em 0; padding: 0.75em 1.25em; border-left: 4px solid #7c3aed; background: #f5f3ff; border-radius: 0 8px 8px 0; }
        .ql-editor pre.ql-syntax { margin: 1.25em 0; padding: 1em; background: #1e293b; color: #e2e8f0; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
        .ql-editor img { max-width: 100%; height: auto; margin: 1.25em 0; border-radius: 8px; }
    </style>
</head>

                    <button onclick="logout()" class="bg-gradient-to-r from-red-500 to-red-600 text-white px-4 py-2 rounded-lg text-sm shadow-md"><i class="fas fa-sign-out-alt"></i><span class="hidden sm:inline">Logout</span></button>

    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-xl shadow-md p-5"><label class="block text-sm font-medium mb-1">Judul <span class="text-red-500">*</span></label><input type="text" id="articleTitle" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-500" placeholder="Masukkan judul..."><div class="flex items-center justify-between mt-4"><label class="text-sm">Slug URL</label><span class="text-xs text-gray-400">Otomatis</span></div><div class="flex gap-2"><input type="text" id="articleSlug" class="flex-1 border rounded-lg px-4 py-2 bg-gray-50" placeholder="slug"><button onclick="copySlug()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg"><i class="fas fa-copy"></i></button><button onclick="generateSlug()" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-4 py-2 rounded-lg"><i class="fas fa-sync-alt"></i></button></div><p class="text-xs text-gray-400 mt-1"><i class="fas fa-info-circle"></i> Slug akan digunakan sebagai URL artikel</p></div>
                
                <div class="bg-white rounded-xl shadow-md p-5"><label class="block text-sm font-medium mb-2">Kategori <span class="text-red-500">*</span></label><select id="articleCategory" class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500"><option value="">-- Pilih --</option><option value="Kabar Gardu">📡 Kabar Gardu</option><option value="Jejak Lapangan">🗺️ Jejak Lapangan</option><option value="Kisah Tetangga">👥 Kisah Tetangga</option><option value="Obrolan Warung">☕ Obrolan Warung</option><option value="Rembuk Warga">💬 Rembuk Warga</option><option value="Sorot Publik">🔦 Sorot Publik</option><option value="Balai Komunitas">🏛️ Balai Komunitas</option><option value="Gerak Bareng">🤝 Gerak Bareng</option><option value="Lapak Lokal">🛍️ Lapak Lokal</option><option value="Cerita Ladang">🌱 Cerita Ladang</option><option value="Denyut Negeri">🌏 Denyut Negeri</option><option value="Gawe Kampung">🔨 Gawe Kampung</option></select></div>
                
                <div class="bg-white rounded-xl shadow-md p-5"><div class="flex justify-between items-center mb-2"><label class="text-sm font-medium">Konten <span class="text-red-500">*</span></label><button onclick="pasteFromClipboard()" class="text-xs text-purple-600 hover:text-purple-800"><i class="fas fa-paste mr-1"></i>Paste</button></div><div id="editor"></div><p class="text-xs text-gray-400 mt-2"><span id="wordCountDisplay">0 kata</span></p></div>
                <div class="bg-white rounded-xl shadow-md p-5"><div class="flex justify-between mb-2"><label class="text-sm font-medium">Excerpt <span class="text-red-500">*</span></label><span class="text-xs" id="excerptCount">0/160</span></div><textarea id="articleExcerpt" rows="3" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-500" placeholder="Ringkasan..."></textarea></div>
                <div class="bg-white rounded-xl shadow-md p-5"><div class="flex justify-between mb-2"><label class="text-sm font-medium">Sumber</label><span class="text-xs text-gray-400">Opsional</span></div><div class="relative"><i class="fas fa-link absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="url" id="sourceUrl" class="w-full border rounded-lg pl-10 pr-4 py-2 focus:ring-2 focus:ring-purple-500" placeholder="https://..."></div></div>
            </div>
            <div class="space-y-4">
                <div class="bg-gradient-to-r from-purple-600 to-purple-500 rounded-xl shadow-md p-5 text-white"><h3 class="font-semibold mb-2">Alur Admin</h3><div class="space-y-2 text-sm"><div class="flex items-center gap-2"><span class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs">1</span>Tulis</div><div class="flex items-center gap-2"><span class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs">2</span>Kategori</div><div class="flex items-center gap-2"><span class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs">3</span>Publish/Draft</div></div></div>
                <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-semibold mb-3"><i class="fas fa-image text-purple-600"></i> Gambar Utama</h3><div class="flex border-b mb-3"><button id="tabFile" class="flex-1 py-2 text-sm font-medium text-purple-600 border-b-2 border-purple-600" onclick="switchImageTab('file')">Upload</button><button id="tabUrl" class="flex-1 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent" onclick="switchImageTab('url')">URL</button></div><div id="uploadFileSection"><input type="file" id="imageFile" accept="image/*" class="w-full border rounded-lg p-2 text-sm"><div id="uploadProgress" class="mt-2 hidden"><div class="flex items-center gap-2"><div class="flex-1 bg-gray-200 rounded-full h-2"><div id="progressBar" class="bg-purple-600 h-2 rounded-full" style="width:0%"></div></div><span id="progressText" class="text-xs">0%</span></div></div></div><div id="uploadUrlSection" class="hidden"><input type="text" id="featuredImage" class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="https://..."></div><div class="mt-3"><input type="text" id="imageCaption" class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="Caption..."></div><div id="imagePreview" class="mt-3 hidden"><img id="previewImg" class="w-full h-32 object-cover rounded-lg" src=""><button onclick="removeImage()" class="text-red-500 text-xs mt-2">Hapus</button></div></div>
                <div class="bg-white rounded-xl shadow-md p-5"><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="isFeatured" class="w-5 h-5 text-yellow-500 rounded"><span class="font-medium"><i class="fas fa-star text-yellow-500 mr-2"></i>Featured</span></label></div>
                <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-semibold mb-3"><i class="fas fa-paper-plane text-purple-600"></i> Publikasi</h3><div class="space-y-2"><button onclick="publishArticle()" id="publishBtn" class="action-btn w-full bg-green-600 text-white py-2.5 rounded-lg font-medium"><i class="fas fa-globe"></i> Publish</button><button onclick="saveAsDraft()" id="draftBtn" class="action-btn w-full bg-gray-100 text-gray-700 py-2.5 rounded-lg font-medium border"><i class="fas fa-save"></i> Draft</button><hr><button onclick="previewArticle()" class="action-btn w-full bg-blue-100 text-blue-700 py-2.5 rounded-lg font-medium"><i class="fas fa-eye"></i> Preview</button><a href="index.html" class="action-btn w-full bg-gray-50 text-gray-600 py-2.5 rounded-lg font-medium flex items-center justify-center gap-2"><i class="fas fa-times"></i> Batal</a></div><div id="autoSaveStatus" class="mt-3 text-xs text-gray-400 text-center">Siap menulis</div></div>
            </div>
        </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 hidden"><span id="toastMessage"></span></div>

    <!-- FUNGSI SLUG DI ROOT SCOPE -->
    <script>
        function generateSlug() { 
            const t = document.getElementById('articleTitle');
            const s = document.getElementById('articleSlug');
            if (t && s && t.value) {
                s.value = t.value.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-+|-+$/g, '');
            }
        }
        function copySlug() { 
            const s = document.getElementById('articleSlug'); 
            if (!s.value) generateSlug(); 
            s.select(); 
            navigator.clipboard?.writeText(s.value) || document.execCommand('copy'); 
        }
        document.addEventListener('DOMContentLoaded', function() {
            const titleInput = document.getElementById('articleTitle');
            if (titleInput) {
                titleInput.addEventListener('input', generateSlug);
                titleInput.addEventListener('blur', generateSlug);
            }
        });
    </script>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let supabase = null;
        async function initSupabase() {
            const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const c = await r.json();
            if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
        }
        
        let convertedImageBase64=null,tempWebPFile=null,currentImageTab='file',userId=null,userName=null,quill,isSubmitting=false,hasChanges=false,autoSaveTimer=null,currentDraftId=null,lastSavedContent='';
        
        async function convertToWebP(file,q=0.85){return new Promise((resolve,reject)=>{const img=new Image(),reader=new FileReader();reader.onload=e=>img.src=e.target.result;img.onload=()=>{const c=document.createElement('canvas'),mw=1200;let w=img.width,h=img.height;if(w>mw){h=h*(mw/w);w=mw;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);convertedImageBase64=c.toDataURL('image/webp',q);document.getElementById('previewImg').src=convertedImageBase64;document.getElementById('imagePreview').classList.remove('hidden');c.toBlob(b=>{if(!b)return reject('Gagal');tempWebPFile=new File([b],file.name.replace(/\.\w+$/,'.webp'),{type:'image/webp'});resolve(tempWebPFile);},'image/webp',q);};img.onerror=()=>reject('Gagal');reader.onerror=()=>reject('Gagal');reader.readAsDataURL(file);});}
        async function uploadImageToStorage(file){const fn=`article-images/${userId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;const{error}=await supabase.storage.from('articles').upload(fn,file,{cacheControl:'3600',upsert:false});if(error)throw error;return supabase.storage.from('articles').getPublicUrl(fn).data.publicUrl;}
        
        async function checkUser(){if(!supabase)return false;const{data:{session}}=await supabase.auth.getSession();if(!session){window.location.href='../../../auth/login.html';return false;}const{data:p}=await supabase.from('profiles').select('role,full_name').eq('id',session.user.id).single();if(!p||p.role!=='admin'){window.location.href='../../../auth/login.html';return false;}userId=session.user.id;userName=p?.full_name||session.user.email?.split('@')[0]||'Admin';document.getElementById('userName').textContent=userName;document.getElementById('userEmail').textContent=session.user.email;return true;}
        
        // ===== ENHANCED QUILL INIT =====
        function initQuill(){
            if(quill)return;
            // Override default tag DIV → P
            const Block = Quill.import('blots/block');
            Block.tagName = 'P';
            Quill.register(Block, true);
            
            quill=new Quill('#editor',{theme:'snow',placeholder:'Tulis konten...',modules:{toolbar:[['bold','italic','underline','strike'],['blockquote','code-block'],[{header:1},{header:2}],[{list:'ordered'},{list:'bullet'}],[{indent:'-1'},{indent:'+1'}],[{size:['small',false,'large','huge']}],[{color:[]},{background:[]}],[{align:[]}],['clean'],['link','image']]}});
            quill.on('text-change',()=>{updateWordCount();hasChanges=true;updateAutoSaveStatus('Menyimpan...','text-gray-400');});
            
            // Shift+Enter = line break, Enter = new paragraph
            quill.keyboard.addBinding({ key: 13, shiftKey: true }, function(range, context) {
                quill.insertText(range.index, '\n');
                return false;
            });
            
            updateWordCount();
        }
        function updateWordCount(){if(!quill)return;const t=quill.getText().trim();document.getElementById('wordCountDisplay').textContent=`${t?t.split(/\s+/).filter(w=>w.length>0).length:0} kata`;}
        
        function startAutoSave(){if(autoSaveTimer)clearInterval(autoSaveTimer);autoSaveTimer=setInterval(async()=>{const t=document.getElementById('articleTitle').value.trim(),c=quill?.root.innerHTML||'',cc=t+c;if(!hasChanges||cc===lastSavedContent)return;if(!t&&!c.replace(/<[^>]*>/g,'').trim())return;await performAutoSave();},30000);}
        
        async function performAutoSave(){try{const t=document.getElementById('articleTitle').value.trim()||'Draft',c=quill?.root.innerHTML||'',e=document.getElementById('articleExcerpt').value.trim()||null,cat=document.getElementById('articleCategory').value||'Kabar Gardu',d={title:t,content:c,excerpt:e,category:cat,status:'draft',author_id:userId,author_role:'admin',author_name:userName,updated_at:new Date().toISOString()};if(!document.getElementById('articleSlug').value && typeof generateSlug === 'function') generateSlug();d.slug=document.getElementById('articleSlug').value||t.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'');if(currentDraftId){const{error}=await supabase.from('article_index').update(d).eq('id',currentDraftId);if(!error){lastSavedContent=t+c;updateAutoSaveStatus('✅ Tersimpan','text-green-500');hasChanges=false;}}else{d.created_at=new Date().toISOString();const{data,error}=await supabase.from('article_index').insert(d).select('id').single();if(!error&&data){currentDraftId=data.id;lastSavedContent=t+c;updateAutoSaveStatus('✅ Tersimpan','text-green-500');hasChanges=false;}}}catch(e){updateAutoSaveStatus('❌ Gagal','text-red-500');}}
        
        function updateAutoSaveStatus(tx,cl){const el=document.getElementById('autoSaveStatus');if(el)el.innerHTML=`<i class="fas ${cl==='text-green-500'?'fa-check-circle':cl==='text-red-500'?'fa-exclamation-circle':'fa-clock'} ${cl}"></i> ${tx}`;}
        
        window.addEventListener('beforeunload',e=>{if(hasChanges){e.preventDefault();e.returnValue='Ada perubahan belum tersimpan.';}});
        window.switchImageTab=t=>{currentImageTab=t;document.getElementById('tabFile').className=t==='file'?'flex-1 py-2 text-sm font-medium text-purple-600 border-b-2 border-purple-600':'flex-1 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent';document.getElementById('tabUrl').className=t==='url'?'flex-1 py-2 text-sm font-medium text-purple-600 border-b-2 border-purple-600':'flex-1 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent';document.getElementById('uploadFileSection').classList.toggle('hidden',t!=='file');document.getElementById('uploadUrlSection').classList.toggle('hidden',t!=='url');};
        
        document.getElementById('imageFile')?.addEventListener('change',async function(e){const f=e.target.files[0];if(f){try{await convertToWebP(f,0.85);showToast('Gambar siap','success');hasChanges=true;}catch(err){const r=new FileReader();r.onload=e=>{convertedImageBase64=e.target.result;document.getElementById('previewImg').src=e.target.result;document.getElementById('imagePreview').classList.remove('hidden');};r.readAsDataURL(f);tempWebPFile=f;}}});
        
        window.pasteFromClipboard=async()=>{try{const t=await navigator.clipboard.readText();if(t){quill.root.innerHTML=t.includes('<')&&t.includes('>')?t:t.split('\n').filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join('');updateWordCount();showToast('Ditempel','success');hasChanges=true;}}catch(e){showToast('Gagal paste','error');}};
        
        document.getElementById('articleCategory')?.addEventListener('change',()=>{hasChanges=true;});
        document.getElementById('articleExcerpt')?.addEventListener('input',function(){const l=this.value.length;document.getElementById('excerptCount').textContent=`${l}/160`;document.getElementById('excerptCount').classList.toggle('text-red-500',l>160);hasChanges=true;});
        document.getElementById('featuredImage')?.addEventListener('input',function(){if(this.value){document.getElementById('previewImg').src=this.value;document.getElementById('imagePreview').classList.remove('hidden');}else{document.getElementById('imagePreview').classList.add('hidden');}hasChanges=true;});
        window.removeImage=()=>{document.getElementById('featuredImage').value='';document.getElementById('imageFile').value='';document.getElementById('imageCaption').value='';document.getElementById('imagePreview').classList.add('hidden');convertedImageBase64=null;tempWebPFile=null;hasChanges=true;};
        
        function validateForm(){const t=document.getElementById('articleTitle').value.trim(),c=quill?.root.innerHTML.trim()||'',e=document.getElementById('articleExcerpt').value.trim(),cat=document.getElementById('articleCategory').value;if(!t){showToast('Judul wajib','error');return false;}if(t.length>150){showToast('Judul maks 150','error');return false;}if(!cat){showToast('Kategori wajib','error');return false;}if(!c||c==='<p><br></p>'){showToast('Konten wajib','error');return false;}if(!e){showToast('Excerpt wajib','error');return false;}if(e.length>160){showToast('Excerpt maks 160','error');return false;}return true;}
        
        async function getFormData(){if(!document.getElementById('articleSlug').value && typeof generateSlug === 'function') generateSlug();let img=null;if(currentImageTab==='file'){let f=tempWebPFile||document.getElementById('imageFile').files[0];if(f){try{document.getElementById('uploadProgress').classList.remove('hidden');if(!tempWebPFile){document.getElementById('progressText').textContent='Konversi...';document.getElementById('progressBar').style.width='30%';f=await convertToWebP(f,0.85);}document.getElementById('progressText').textContent='Upload...';document.getElementById('progressBar').style.width='70%';img=await uploadImageToStorage(f);document.getElementById('progressBar').style.width='100%';document.getElementById('uploadProgress').classList.add('hidden');}catch(e){document.getElementById('uploadProgress').classList.add('hidden');throw e;}}}else{img=document.getElementById('featuredImage').value||null;}return{title:document.getElementById('articleTitle').value.trim(),slug:document.getElementById('articleSlug').value,excerpt:document.getElementById('articleExcerpt').value.trim(),content:quill?quill.root.innerHTML:'',category:document.getElementById('articleCategory').value,featured_image:img,image_caption:document.getElementById('imageCaption').value||null,file_path:img,source_url:document.getElementById('sourceUrl').value||null,is_featured:document.getElementById('isFeatured').checked,author_id:userId,author_role:'admin',author_name:userName};}
        
        function showToast(m,t='success'){const toast=document.getElementById('toast'),msg=document.getElementById('toastMessage');toast.classList.remove('bg-green-500','bg-red-500','bg-blue-500','bg-yellow-500');if(t==='error')toast.classList.add('bg-red-500');else if(t==='info')toast.classList.add('bg-blue-500');else if(t==='warning')toast.classList.add('bg-yellow-500');else toast.classList.add('bg-green-500');msg.textContent=m;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),4000);}
        
        window.saveAsDraft=async function(){const t=document.getElementById('articleTitle').value.trim();if(!t){showToast('Minimal isi judul','error');return;}if(isSubmitting)return;isSubmitting=true;const b=document.getElementById('draftBtn');b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...';try{const fd=await getFormData();fd.status='draft';if(!fd.category)fd.category='Kabar Gardu';let r;if(currentDraftId)r=await supabase.from('article_index').update(fd).eq('id',currentDraftId);else{fd.created_at=new Date().toISOString();r=await supabase.from('article_index').insert(fd).select().single();if(r.data)currentDraftId=r.data.id;}if(r.error)throw r.error;hasChanges=false;lastSavedContent=fd.title+fd.content;updateAutoSaveStatus('✅ Tersimpan','text-green-500');showToast('Draft disimpan!');setTimeout(()=>window.location.href='index.html',1000);}catch(e){showToast('Gagal: '+e.message,'error');b.disabled=false;b.innerHTML='<i class="fas fa-save mr-1"></i>Draft';isSubmitting=false;}};
        
        window.publishArticle=async function(){if(!validateForm())return;const r=await Swal.fire({title:'Publish?',text:'Artikel akan langsung tayang.',icon:'question',showCancelButton:true,confirmButtonColor:'#16a34a',confirmButtonText:'Ya',cancelButtonText:'Batal'});if(!r.isConfirmed)return;if(isSubmitting)return;isSubmitting=true;const b=document.getElementById('publishBtn');b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Memproses...';try{const fd=await getFormData();fd.status='published';fd.published_at=new Date().toISOString();let r;if(currentDraftId)r=await supabase.from('article_index').update(fd).eq('id',currentDraftId);else{fd.created_at=new Date().toISOString();r=await supabase.from('article_index').insert(fd);}if(r.error)throw r.error;hasChanges=false;await Swal.fire({icon:'success',title:'Berhasil!',timer:2000});setTimeout(()=>window.location.href='index.html',1500);}catch(e){let m=e.message;if(e.code==='42501')m='Tidak memiliki izin.';else if(e.code==='23505')m='Slug sudah digunakan.';Swal.fire({icon:'error',title:'Gagal',text:m});b.disabled=false;b.innerHTML='<i class="fas fa-globe mr-1"></i>Publish';isSubmitting=false;}};
        
        window.previewArticle=function(){let img=null;if(currentImageTab==='file'){img=convertedImageBase64;if(!img&&document.getElementById('imageFile').files[0]){const r=new FileReader();r.readAsDataURL(document.getElementById('imageFile').files[0]);}}else{img=document.getElementById('featuredImage').value||null;}localStorage.setItem('preview_article',JSON.stringify({title:document.getElementById('articleTitle').value||'Tanpa Judul',content:quill?quill.root.innerHTML:'<p>Tidak ada konten</p>',excerpt:document.getElementById('articleExcerpt').value||null,category:document.getElementById('articleCategory').value||'Kabar Gardu',image:img,caption:document.getElementById('imageCaption').value||null,sourceUrl:document.getElementById('sourceUrl').value||null,author:userName}));window.open('preview.html','_blank');};
        
        window.logout=async()=>{const r=await Swal.fire({title:'Logout?',icon:'question',showCancelButton:true,confirmButtonColor:'#dc2626',confirmButtonText:'Ya',cancelButtonText:'Batal'});if(r.isConfirmed){if(supabase)await supabase.auth.signOut();window.location.href='../../../auth/login.html';}};
        
        (async()=>{try{await initSupabase();}catch(e){window.location.href='../../../auth/login.html';return;}if(!await checkUser())return;initQuill();startAutoSave();const u=new URLSearchParams(window.location.search),did=u.get('draft');if(did)currentDraftId=did;lastSavedContent=document.getElementById('articleTitle').value+(quill?.root.innerHTML||'');})();
    </script>
</body>
</html>
