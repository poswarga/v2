<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Semua Artikel - Admin POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .status-badge { @apply px-2 py-1 rounded-full text-xs font-medium; }
        .article-row:hover { background: linear-gradient(to right, #eff6ff, #dbeafe); }
        .filter-chip { @apply px-3 py-1.5 rounded-full text-xs bg-gray-100 text-gray-600 hover:bg-blue-100 hover:text-blue-600 transition cursor-pointer; }
        .filter-chip.active { @apply bg-blue-600 text-white; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <!-- ✅ NAVBAR — TEMA BIRU, ICON BACK DIHAPUS -->
    <nav class="bg-white shadow-lg sticky top-0 z-20 border-b border-gray-100">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-blue-500 rounded-xl flex items-center justify-center shadow-md"><i class="fas fa-list text-white text-sm"></i></div>
                <div><h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-blue-500 bg-clip-text text-transparent">Semua Artikel</h1><p class="text-xs text-gray-400 hidden sm:block">Kelola semua konten</p></div>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <!-- ✅ Icon Beranda -->
                <a href="../../../index.html" title="Beranda" class="w-9 h-9 bg-gray-100 hover:bg-blue-100 rounded-full flex items-center justify-center text-gray-600 hover:text-blue-600 transition">
                    <i class="fas fa-home text-sm"></i>
                </a>
                <!-- ✅ Icon Dashboard -->
                <a href="../dashboard.html" title="Dashboard Admin" class="w-9 h-9 bg-gray-100 hover:bg-blue-100 rounded-full flex items-center justify-center text-gray-600 hover:text-blue-600 transition">
                    <i class="fas fa-tachometer-alt text-sm"></i>
                </a>
                <!-- ✅ Icon Refresh -->
                <button onclick="loadArticles()" title="Refresh" class="w-9 h-9 bg-gray-100 hover:bg-blue-100 rounded-full flex items-center justify-center text-gray-600 hover:text-blue-600 transition">
                    <i class="fas fa-sync-alt text-sm"></i>
                </button>
                <a href="create.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm shadow-md"><i class="fas fa-plus mr-1"></i>Tulis</a>
                <span id="adminName" class="text-sm font-semibold hidden sm:inline">Admin</span>
                <button onclick="logout()" class="bg-gradient-to-r from-red-500 to-red-600 text-white px-4 py-2 rounded-lg text-sm shadow-md"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
            <div class="bg-white rounded-xl shadow-md p-3 cursor-pointer hover:shadow-lg" onclick="filterByStatus('all')"><p class="text-xs text-gray-500">Semua</p><p class="text-xl font-bold" id="statAll">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 cursor-pointer hover:shadow-lg" onclick="filterByStatus('pending_editor')"><p class="text-xs text-gray-500">Pending</p><p class="text-xl font-bold text-yellow-600" id="statPendingEditor">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 cursor-pointer hover:shadow-lg" onclick="filterByStatus('published')"><p class="text-xs text-gray-500">Published</p><p class="text-xl font-bold text-green-600" id="statPublished">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 cursor-pointer hover:shadow-lg" onclick="filterByStatus('rejected')"><p class="text-xs text-gray-500">Ditolak</p><p class="text-xl font-bold text-red-600" id="statRejected">0</p></div>
            <div class="bg-white rounded-xl shadow-md p-3 cursor-pointer hover:shadow-lg" onclick="filterByStatus('archived')"><p class="text-xs text-gray-500">Arsip</p><p class="text-xl font-bold text-gray-600" id="statArchived">0</p></div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2"><span class="filter-chip active" data-status="all">Semua</span><span class="filter-chip" data-status="pending_editor">Pending</span><span class="filter-chip" data-status="published">Published</span><span class="filter-chip" data-status="rejected">Ditolak</span><span class="filter-chip" data-status="archived">Arsip</span></div>
                <div class="flex flex-wrap gap-2">
                    <select id="roleFilter" class="text-sm border rounded-lg px-3 py-1.5 bg-gray-50"><option value="all">Semua Role</option><option value="editor">Editor</option><option value="member">Member</option><option value="user">User</option><option value="admin">Admin</option></select>
                    <div class="relative"><input type="text" id="searchInput" placeholder="Cari..." class="text-sm border rounded-lg px-3 py-1.5 pl-9 bg-gray-50 w-64"><i class="fas fa-search absolute left-3 top-2 text-gray-400 text-sm"></i></div>
                    <button onclick="loadArticles()" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50"><tr><th class="py-3 px-4"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Judul</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Penulis</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Role</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Editor</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Status</th><th class="py-3 px-4 text-center text-xs font-semibold text-gray-500 uppercase">Featured</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Tanggal</th><th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Aksi</th></tr></thead><tbody id="articleTableBody"><tr><td colspan="9" class="text-center py-12"><i class="fas fa-spinner fa-spin text-blue-600"></i></td></tr></tbody></table></div>
            <div class="px-5 py-4 border-t bg-gray-50 flex flex-wrap justify-between items-center gap-3"><div class="text-sm">Menampilkan <span id="showingStart">0</span>-<span id="showingEnd">0</span> dari <span id="totalCount">0</span></div><div class="flex gap-2"><button id="prevPage" class="px-3 py-1.5 bg-white border rounded-lg disabled:opacity-50" disabled><i class="fas fa-chevron-left"></i></button><span class="px-3 py-1.5 bg-blue-100 text-blue-800 rounded-lg" id="currentPage">1</span><button id="nextPage" class="px-3 py-1.5 bg-white border rounded-lg disabled:opacity-50" disabled><i class="fas fa-chevron-right"></i></button></div></div>
        </div>

        <div id="bulkActions" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white shadow-2xl rounded-xl px-6 py-4 border hidden z-30"><div class="flex items-center gap-4"><span class="text-sm"><span id="selectedCount">0</span> dipilih</span><select id="bulkStatusSelect" class="text-sm border rounded-lg px-3 py-1.5"><option value="">Ubah...</option><option value="published">Publish</option><option value="archived">Arsipkan</option><option value="rejected">Tolak</option></select><button onclick="applyBulkStatus()" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm">Terapkan</button><button onclick="bulkDelete()" class="bg-red-500 text-white px-4 py-1.5 rounded-lg text-sm"><i class="fas fa-trash mr-1"></i>Hapus</button><button onclick="clearSelection()" class="text-gray-500"><i class="fas fa-times"></i></button></div></div>
    </div>

    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center"><div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4 p-6"><h3 class="text-lg font-bold mb-4 text-red-600">Hapus Artikel?</h3><p class="text-sm mb-2">Yakin hapus <strong id="deleteArticleTitle"></strong>?</p><div class="flex justify-end gap-2"><button onclick="closeDeleteModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Batal</button><button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 text-white rounded-lg">Hapus</button></div></div></div>

    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 hidden"><span id="toastMessage"></span></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let supabase = null;
        async function initSupabase() {
            const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const c = await r.json();
            if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
        }

        let articles=[],selectedArticles=new Set(),currentStatus='all',currentRole='all',currentSearch='',currentPage=1,pageSize=20,stats={},totalCount=0,articleToDelete=null,authorCache={},editorCache={};

        async function checkAdmin(){if(!supabase){window.location.href='../../../auth/login.html';return false}const{data:{session}}=await supabase.auth.getSession();if(!session){window.location.href='../../../auth/login.html';return false}const{data:p}=await supabase.from('profiles').select('role,full_name').eq('id',session.user.id).single();if(p?.role!=='admin'){window.location.href=p?.role==='editor'?'../../editor/dashboard.html':p?.role==='member'?'../../member/dashboard.html':'../../user/dashboard.html';return false}document.getElementById('adminName').textContent=p?.full_name||session.user.email;await loadStats();await loadArticles();return true}

        async function loadStats(){const ss=['pending_editor','published','rejected','archived'];for(let s of ss){const{count}=await supabase.from('article_index').select('*',{count:'exact',head:true}).eq('status',s);stats[s]=count||0}const{count:all}=await supabase.from('article_index').select('*',{count:'exact',head:true});stats.all=all||0;document.getElementById('statAll').textContent=stats.all;document.getElementById('statPendingEditor').textContent=stats.pending_editor||0;document.getElementById('statPublished').textContent=stats.published||0;document.getElementById('statRejected').textContent=stats.rejected||0;document.getElementById('statArchived').textContent=stats.archived||0}

        window.loadArticles=async function(){if(!supabase)return;const start=(currentPage-1)*pageSize,end=start+pageSize-1;let q=supabase.from('article_index').select('id,title,slug,excerpt,author_id,author_role,author_name,editor_id,editor_name,status,rejection_note,is_featured,created_at',{count:'exact'}).order('created_at',{ascending:false}).range(start,end);if(currentStatus!=='all')q=q.eq('status',currentStatus);if(currentRole!=='all')q=q.eq('author_role',currentRole);if(currentSearch)q=q.ilike('title',`%${currentSearch}%`);const{data,error,count}=await q;if(error){showToast('Gagal: '+error.message,'error');return}articles=data||[];totalCount=count||0;await loadMissingNames();renderArticles();updatePagination()}

        async function loadMissingNames(){const aids=[...new Set(articles.filter(a=>!a.author_name&&a.author_id).map(a=>a.author_id))];const eids=[...new Set(articles.filter(a=>!a.editor_name&&a.editor_id).map(a=>a.editor_id))];if(aids.length){const{data:au}=await supabase.from('profiles').select('id,full_name').in('id',aids);if(au)au.forEach(a=>authorCache[a.id]=a)}if(eids.length){const{data:ed}=await supabase.from('profiles').select('id,full_name').in('id',eids);if(ed)ed.forEach(e=>editorCache[e.id]=e)}articles.forEach(a=>{if(!a.author_name&&a.author_id&&authorCache[a.author_id])a.author_name=authorCache[a.author_id].full_name;if(!a.editor_name&&a.editor_id&&editorCache[a.editor_id])a.editor_name=editorCache[a.editor_id].full_name})}

        function applyFilters(){currentPage=1;loadArticles()}

        function showChatIcon(status) { return status === 'pending_editor' || status === 'rejected'; }

        function renderArticles(){const tbody=document.getElementById('articleTableBody');if(!articles.length){tbody.innerHTML='<tr><td colspan="9" class="text-center py-12"><i class="fas fa-newspaper text-4xl mb-3 opacity-50"></i><p>Tidak ada artikel</p></td></tr>';return}tbody.innerHTML=articles.map(a=>{const author=a.author_name||'-',editor=a.editor_name||'-';const date=new Date(a.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});const checked=selectedArticles.has(a.id)?'checked':'';const fi=a.is_featured?`<button onclick="setFeatured('${a.id}',false)" class="text-yellow-500"><i class="fas fa-star"></i></button>`:`<button onclick="setFeatured('${a.id}',true)" class="text-gray-400"><i class="far fa-star"></i></button>`;const rb={editor:'bg-purple-100 text-purple-800',member:'bg-green-100 text-green-800',user:'bg-orange-100 text-orange-800',admin:'bg-blue-100 text-blue-800'};const sb={draft:'bg-gray-100',pending_editor:'bg-yellow-100',published:'bg-green-100',rejected:'bg-red-100',archived:'bg-gray-200'},sl={draft:'Draft',pending_editor:'Pending',published:'Published',rejected:'Ditolak',archived:'Arsip'};
            let actionBtns='';
            if(a.status==='archived')actionBtns=`<button onclick="unarchive('${a.id}')" class="text-blue-600 p-2 hover:bg-blue-50 rounded-lg" title="Publish Ulang"><i class="fas fa-globe"></i></button>`;
            else if(a.status==='published')actionBtns=`<button onclick="archive('${a.id}')" class="text-gray-600 p-2 hover:bg-gray-100 rounded-lg" title="Arsipkan"><i class="fas fa-archive"></i></button>`;
            else if(a.status==='draft'&&a.author_role==='admin')actionBtns=`<button onclick="quickPublish('${a.id}')" class="text-green-600 p-2 hover:bg-green-50 rounded-lg" title="Publish"><i class="fas fa-check"></i></button>`;
            
            // ✅ TOMBOL CHAT
            const chatBtn = showChatIcon(a.status) ? `<a href="detail-chat.html?id=${a.id}" class="text-teal-600 p-2 hover:bg-teal-50 rounded-lg" title="Pantau Chat"><i class="fas fa-comments"></i></a>` : '';
            // ✅ TOMBOL LIHAT
            const viewBtn = a.status==='published' ? `<a href="https://postingan.poswarga.com/posts/${a.slug}" target="_blank" class="text-gray-600 p-2 hover:bg-gray-100 rounded-lg" title="Lihat"><i class="fas fa-eye"></i></a>` : '';
            // ✅ TOMBOL HAPUS (selalu ada)
            const deleteBtn = `<button onclick="openDeleteModal('${a.id}','${escapeHtml(a.title||'Tanpa Judul').replace(/'/g,"\\'")}')" class="text-red-600 p-2 hover:bg-red-50 rounded-lg" title="Hapus"><i class="fas fa-trash"></i></button>`;

            return`<tr class="article-row border-b hover:bg-blue-50"><td class="py-3 px-4"><input type="checkbox" class="article-checkbox rounded" data-id="${a.id}" ${checked} onchange="toggleSelection('${a.id}')"></td><td class="py-3 px-4"><p class="font-medium">${escapeHtml(a.title)||'Tanpa Judul'}</p><p class="text-xs text-gray-400">${escapeHtml(a.excerpt)||'-'}</p></td><td class="py-3 px-4 text-sm">${escapeHtml(author)}</td><td class="py-3 px-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${rb[a.author_role]||rb.user}">${a.author_role==='editor'?'Editor':a.author_role==='member'?'Member':a.author_role==='admin'?'Admin':'User'}</span></td><td class="py-3 px-4 text-sm">${escapeHtml(editor)}</td><td class="py-3 px-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${sb[a.status]||'bg-gray-100'}">${sl[a.status]||a.status}</span>${a.rejection_note?`<p class="text-xs text-red-500 truncate max-w-[120px]" title="${escapeHtml(a.rejection_note)}">${escapeHtml(a.rejection_note.substring(0,30))}...</p>`:''}</td><td class="py-3 px-4 text-center">${fi}</td><td class="py-3 px-4 text-sm">${date}</td><td class="py-3 px-4"><div class="flex gap-1">${chatBtn}${viewBtn}${actionBtns}${deleteBtn}</div></td></tr>`}).join('');updateSelectAll()}

        function updatePagination(){const tp=Math.ceil(totalCount/pageSize),s=totalCount?(currentPage-1)*pageSize+1:0,e=Math.min(currentPage*pageSize,totalCount);document.getElementById('showingStart').textContent=s;document.getElementById('showingEnd').textContent=e;document.getElementById('totalCount').textContent=totalCount;document.getElementById('currentPage').textContent=currentPage;document.getElementById('prevPage').disabled=currentPage===1;document.getElementById('nextPage').disabled=currentPage>=tp}

        function escapeHtml(s){return s?String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]):''}

        window.setFeatured=async(id,f)=>{const{error}=await supabase.from('article_index').update({is_featured:f}).eq('id',id);if(error)showToast('Gagal','error');else{showToast(f?'Featured!':'Dihapus');loadArticles()}}
        window.openDeleteModal=(id,t)=>{articleToDelete=id;document.getElementById('deleteArticleTitle').textContent=t;document.getElementById('deleteModal').classList.remove('hidden')}
        window.closeDeleteModal=()=>{articleToDelete=null;document.getElementById('deleteModal').classList.add('hidden')}
        window.confirmDelete=async()=>{if(!articleToDelete)return;const{error}=await supabase.from('article_index').delete().eq('id',articleToDelete);if(error)showToast('Gagal','error');else{showToast('Dihapus');selectedArticles.delete(articleToDelete);closeDeleteModal();loadStats();loadArticles()}}
        window.bulkDelete=async()=>{if(!selectedArticles.size)return;if(!confirm(`Hapus ${selectedArticles.size}?`))return;const{error}=await supabase.from('article_index').delete().in('id',Array.from(selectedArticles));if(error)showToast('Gagal','error');else{showToast(`${selectedArticles.size} dihapus`);clearSelection();loadStats();loadArticles()}}

        window.filterByStatus=s=>{currentStatus=s;document.querySelectorAll('[data-status]').forEach(c=>c.classList.toggle('active',c.dataset.status===s));applyFilters()}
        document.querySelectorAll('[data-status]').forEach(c=>c.addEventListener('click',()=>filterByStatus(c.dataset.status)));
        document.getElementById('roleFilter').addEventListener('change',e=>{currentRole=e.target.value;applyFilters()});
        document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(e.target.timeout);e.target.timeout=setTimeout(()=>{currentSearch=e.target.value;applyFilters()},300)});
        document.getElementById('prevPage').addEventListener('click',()=>{if(currentPage>1){currentPage--;loadArticles()}});
        document.getElementById('nextPage').addEventListener('click',()=>{if(currentPage*pageSize<totalCount){currentPage++;loadArticles()}});

        window.toggleSelection=id=>{selectedArticles.has(id)?selectedArticles.delete(id):selectedArticles.add(id);updateBulkActions();updateSelectAll()}
        window.toggleSelectAll=()=>{const cbs=document.querySelectorAll('.article-checkbox');if(document.getElementById('selectAll').checked)cbs.forEach(cb=>{selectedArticles.add(cb.dataset.id);cb.checked=true});else{selectedArticles.clear();cbs.forEach(cb=>cb.checked=false)}updateBulkActions()}
        function updateSelectAll(){const cbs=document.querySelectorAll('.article-checkbox');document.getElementById('selectAll').checked=cbs.length&&Array.from(cbs).every(cb=>cb.checked)}
        function updateBulkActions(){const c=selectedArticles.size;document.getElementById('selectedCount').textContent=c;document.getElementById('bulkActions').classList.toggle('hidden',c===0)}
        window.clearSelection=()=>{selectedArticles.clear();document.querySelectorAll('.article-checkbox').forEach(cb=>cb.checked=false);document.getElementById('selectAll').checked=false;updateBulkActions()}

        window.applyBulkStatus=async()=>{const s=document.getElementById('bulkStatusSelect').value;if(!s||!selectedArticles.size)return;const u={status:s,updated_at:new Date().toISOString()};if(s==='published')u.published_at=new Date().toISOString();if(s==='archived')u.archived_at=new Date().toISOString();const{error}=await supabase.from('article_index').update(u).in('id',Array.from(selectedArticles));if(error)showToast('Gagal','error');else{showToast(`${selectedArticles.size} diupdate`);clearSelection();loadStats();loadArticles()}}

        window.quickPublish=async id=>{if(!confirm('Publish?'))return;await supabase.from('article_index').update({status:'published',published_at:new Date().toISOString()}).eq('id',id);showToast('Dipublish!');loadStats();loadArticles()}
        window.archive=async id=>{if(!confirm('Arsipkan?'))return;await supabase.from('article_index').update({status:'archived',archived_at:new Date().toISOString()}).eq('id',id);showToast('Diarsipkan');loadStats();loadArticles()}
        window.unarchive=async id=>{if(!confirm('Publish ulang?'))return;const{error}=await supabase.from('article_index').update({status:'published',published_at:new Date().toISOString(),archived_at:null}).eq('id',id);if(error)showToast('Gagal','error');else{showToast('Dipublish ulang!');loadStats();loadArticles()}}

        window.logout=async()=>{if(supabase)await supabase.auth.signOut();window.location.href='../../../auth/login.html'}
        function showToast(m,t='success'){const toast=document.getElementById('toast'),msg=document.getElementById('toastMessage');toast.classList.remove('bg-green-500','bg-red-500','bg-blue-500');toast.classList.add(t==='success'?'bg-green-500':t==='error'?'bg-red-500':'bg-blue-500');msg.textContent=m;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),3000)}

        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDeleteModal()});
        (async()=>{try{await initSupabase();}catch(e){window.location.href='../../../auth/login.html';return}if(supabase)checkAdmin();else window.location.href='../../../auth/login.html'})();
    </script>
</body>
</html>
