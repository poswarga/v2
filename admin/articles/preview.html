<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Preview Artikel - Admin POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .article-content { font-family: 'Georgia', 'Times New Roman', serif; line-height: 1.8; color: #374151; }
        .article-content h1 { font-size: 2rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; color: #1f2937; }
        .article-content h2 { font-size: 1.75rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #1f2937; }
        .article-content h3 { font-size: 1.5rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #1f2937; }
        
        /* ===== ENHANCED: SPACING SYNC dengan Editor Quill & Publish ===== */
        .article-content p { margin-bottom: 1.25em; line-height: 1.8; }
        .article-content p:last-child { margin-bottom: 0; }
        .article-content br + br { display: none; }
        .article-content h1 { margin: 1.5em 0 0.75em; line-height: 1.3; font-size: 1.5em; font-weight: 700; }
        .article-content h2 { margin: 1.25em 0 0.5em; line-height: 1.4; font-size: 1.25em; font-weight: 600; }
        
        .article-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 1.25em 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .article-content blockquote { 
            border-left: 4px solid #8b5cf6; 
            padding: 0.75em 1.25em; 
            margin: 1.25em 0; 
            font-style: italic; 
            color: #6b7280; 
            background: #f5f3ff;
            border-radius: 0 8px 8px 0;
        }
        .article-content ul, .article-content ol { margin: 0 0 1.25em 2em; padding-left: 0; }
        .article-content li { margin-bottom: 0.5em; line-height: 1.7; }
        .article-content li:last-child { margin-bottom: 0; }
        .article-content a { color: #8b5cf6; text-decoration: underline; }
        .article-content pre { background: #1f2937; color: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1.25em 0; white-space: pre-wrap; }
        .article-content code { background: #f3f4f6; padding: 0.25rem 0.5rem; border-radius: 4px; font-family: monospace; }
        
        .featured-caption { text-align: left; font-size: 13px; color: #6b7280; padding: 10px 16px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; font-style: italic; }
        .featured-caption:empty { display: none; }
        .preview-banner { background: linear-gradient(135deg, #7e22ce 0%, #4c1d95 100%); }
        .action-bar { backdrop-filter: blur(8px); background: rgba(255, 255, 255, 0.95); }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <div class="preview-banner text-white px-4 py-2 text-center text-sm sticky top-0 z-30 shadow-md"><i class="fas fa-eye mr-2"></i><span id="previewStatus">PREVIEW MODE</span></div>
    <div class="action-bar sticky top-8 z-20 border-b border-gray-200 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3"><button onclick="window.close()" class="text-gray-600 hover:text-purple-600 p-2"><i class="fas fa-arrow-left"></i></button><div><h2 class="font-semibold">Preview</h2><p class="text-xs text-gray-500" id="articleMeta">-</p></div></div>
            <div class="flex items-center gap-2"><button onclick="copyShareLink()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm"><i class="fas fa-link mr-1"></i>Copy Link</button><a href="#" id="editLink" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-4 py-2 rounded-lg text-sm"><i class="fas fa-edit mr-1"></i>Edit</a><button onclick="window.print()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm"><i class="fas fa-print"></i></button></div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-8">
                <div id="featuredImageContainer" class="hidden"><figure><img id="featuredImage" class="w-full h-64 md:h-96 object-cover" src=""><figcaption id="featuredImageCaption" class="featured-caption"></figcaption></figure></div>
                <div class="p-6 md:p-8">
                    <h1 id="articleTitle" class="text-3xl md:text-4xl font-bold mb-4">-</h1>
                    <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500 mb-6 pb-6 border-b">
                        <div class="flex items-center gap-2"><i class="fas fa-user-circle"></i><span id="authorName">-</span><span id="authorRoleBadge" class="px-2 py-0.5 rounded-full text-xs font-medium">-</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-calendar"></i><span id="createdDate">-</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-tag"></i><span id="statusBadge">-</span></div>
                        <div id="editorInfo" class="flex items-center gap-2 hidden"><i class="fas fa-user-check"></i><span id="editorName">-</span></div>
                    </div>
                    <div id="excerptContainer" class="bg-gray-50 rounded-xl p-4 mb-6 hidden"><p id="articleExcerpt" class="text-gray-600 italic"></p></div>
                    <div id="sourceContainer" class="mb-6 hidden"><p class="text-xs flex items-center gap-1"><i class="fas fa-link"></i>Sumber: <a id="sourceLink" href="#" target="_blank" class="text-purple-600 hover:underline"></a></p></div>
                    <div id="articleContent" class="article-content"><div class="text-center py-12"><i class="fas fa-spinner fa-spin text-purple-600 text-3xl"></i></div></div>
                    <div id="rejectionNoteContainer" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-xl"><h4 class="font-semibold text-red-800">Catatan Penolakan</h4><p id="rejectionNote" class="text-red-700 text-sm"></p></div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 mb-8"><h3 class="font-semibold mb-3">Preview SEO</h3><div class="border rounded-lg p-4 bg-gray-50"><p class="text-blue-600 text-sm mb-1" id="seoUrl">-</p><p class="text-xl font-medium text-blue-800 mb-1" id="seoTitle">-</p><p class="text-sm text-gray-600" id="seoDescription">-</p></div></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 hidden"><span id="toastMessage"></span></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let supabase = null, articleId = null, articleData = null, previewCaption = null;
        async function initSupabase() { const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) }); if (!r.ok) throw new Error(`HTTP ${r.status}`); const c = await r.json(); if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap'); supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY); }
        
        async function checkAccess() {
            const params = new URLSearchParams(window.location.search); articleId = params.get('id');
            const stored = localStorage.getItem('preview_article');
            if (stored) {
                try {
                    const d = JSON.parse(stored); previewCaption = d.caption || null; let imageUrl = d.image || null; if (imageUrl && imageUrl.startsWith('blob:')) imageUrl = null;
                    renderArticle({ id: 'DRAFT', title: d.title || 'Tanpa Judul', slug: 'draft', excerpt: d.excerpt || null, content: d.content || '', featured_image: imageUrl, image_caption: previewCaption, source_url: d.sourceUrl || null, author: { full_name: d.author || 'Admin' }, author_role: 'admin', status: 'draft', created_at: new Date().toISOString() });
                    document.getElementById('previewStatus').textContent = 'DRAFT PREVIEW'; document.getElementById('articleMeta').textContent = 'Preview (belum disimpan)'; document.getElementById('editLink').style.display = 'none'; return;
                } catch (e) {}
            }
            if (!supabase) { try { await initSupabase(); } catch(e) { showToast('Gagal terhubung', 'error'); return; } }
            if (!supabase) { showToast('Gagal terhubung', 'error'); return; }
            if (articleId) { document.getElementById('editLink').href = `edit.html?id=${articleId}`; await loadArticleFromDB(); } else { showToast('Tidak ada data', 'error'); setTimeout(() => window.location.href = 'index.html', 2000); }
        }
        
        async function loadArticleFromDB() {
            const { data, error } = await supabase.from('article_index').select('id, title, slug, excerpt, content, featured_image, image_caption, source_url, author_id, author_role, editor_id, status, rejection_note, created_at').eq('id', articleId).single();
            if (error || !data) { showToast('Gagal memuat', 'error'); return; }
            articleData = data;
            if (data.author_id) { const { data: au } = await supabase.from('profiles').select('full_name, email').eq('id', data.author_id).single(); if (au) data.author = au; }
            if (data.editor_id) { const { data: ed } = await supabase.from('profiles').select('full_name').eq('id', data.editor_id).single(); if (ed) data.editor = ed; }
            renderArticle(data);
        }
        
        function renderArticle(d) {
            document.getElementById('articleTitle').textContent = d.title || 'Tanpa Judul'; document.title = `Preview: ${d.title || 'Artikel'}`;
            document.getElementById('articleMeta').textContent = `ID: ${String(d.id||'').slice(0,8)} | Slug: ${d.slug || '-'}`;
            document.getElementById('authorName').textContent = d.author?.full_name || d.author_name || '-';
            const rc = { editor: 'bg-purple-100 text-purple-800', member: 'bg-green-100 text-green-800', user: 'bg-orange-100 text-orange-800', admin: 'bg-blue-100 text-blue-800' };
            document.getElementById('authorRoleBadge').innerHTML = { editor: 'Editor', member: 'Member', user: 'User', admin: 'Admin' }[d.author_role] || 'User';
            document.getElementById('authorRoleBadge').className = `px-2 py-0.5 rounded-full text-xs font-medium ${rc[d.author_role] || 'bg-gray-100'}`;
            document.getElementById('createdDate').textContent = d.created_at ? new Date(d.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
            const sb = { draft: '<span class="bg-gray-100 text-gray-800 px-2 py-0.5 rounded-full text-xs">Draft</span>', pending_editor: '<span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-xs">Pending</span>', published: '<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded-full text-xs">Published</span>', rejected: '<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded-full text-xs">Ditolak</span>', archived: '<span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full text-xs">Arsip</span>' };
            document.getElementById('statusBadge').innerHTML = sb[d.status] || sb.draft;
            if (d.editor) { document.getElementById('editorName').textContent = d.editor.full_name || d.editor_name; document.getElementById('editorInfo').classList.remove('hidden'); }
            document.getElementById('previewStatus').textContent = `${({draft:'DRAFT',pending_editor:'PENDING',published:'PUBLISHED',rejected:'DITOLAK',archived:'ARSIP'})[d.status]||'PREVIEW'} MODE`;
            if (d.featured_image) { document.getElementById('featuredImage').src = d.featured_image; const cap = d.image_caption || previewCaption; if (cap) document.getElementById('featuredImageCaption').textContent = cap; document.getElementById('featuredImageContainer').classList.remove('hidden'); }
            if (d.excerpt) { document.getElementById('articleExcerpt').textContent = d.excerpt; document.getElementById('excerptContainer').classList.remove('hidden'); }
            if (d.source_url) { document.getElementById('sourceLink').href = d.source_url; document.getElementById('sourceLink').textContent = d.source_url; document.getElementById('sourceContainer').classList.remove('hidden'); }
            document.getElementById('articleContent').innerHTML = d.content || '<p class="text-gray-400 italic text-center py-8">Tidak ada konten</p>';
            if (d.rejection_note) { document.getElementById('rejectionNote').textContent = d.rejection_note; document.getElementById('rejectionNoteContainer').classList.remove('hidden'); }
            document.getElementById('seoUrl').textContent = `https://postingan.poswarga.com/posts/${d.slug || d.id}`;
            document.getElementById('seoTitle').textContent = d.title || 'Tanpa Judul';
            document.getElementById('seoDescription').textContent = d.excerpt || 'Tidak ada deskripsi';
        }
        
        window.copyShareLink = () => { const slug = articleData?.slug || articleData?.id || 'draft'; navigator.clipboard.writeText(`https://postingan.poswarga.com/posts/${slug}`).then(() => showToast('Link disalin!')).catch(() => showToast('Gagal', 'error')); };
        function showToast(m, t = 'success') { const toast = document.getElementById('toast'), msg = document.getElementById('toastMessage'); toast.classList.remove('bg-green-500', 'bg-red-500'); toast.classList.add(t === 'success' ? 'bg-green-500' : 'bg-red-500'); msg.textContent = m; toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 3000); }
        
        (async () => { await initSupabase(); await checkAccess(); })();
    </script>
</body>
</html>
