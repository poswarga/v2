<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Edit Artikel - Admin POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .ql-editor { min-height: 350px; font-size: 16px; }
        .ql-container { font-size: 16px; }
        .ql-toolbar { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .ql-container { border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
        .action-btn { transition: all 0.2s ease; }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* ===== ENHANCED: SPACING SYNC (Create → Edit → Preview → Publish) ===== */
        .ql-editor p { margin-bottom: 1.25em; line-height: 1.8; }
        .ql-editor p:last-child { margin-bottom: 0; }
        .ql-editor br + br { display: none; }
        .ql-editor h1 { margin: 1.5em 0 0.75em; line-height: 1.3; font-size: 1.5em; font-weight: 700; }
        .ql-editor h2 { margin: 1.25em 0 0.5em; line-height: 1.4; font-size: 1.25em; font-weight: 600; }
        .ql-editor ol, .ql-editor ul { margin-bottom: 1.25em; padding-left: 2em; }
        .ql-editor li { margin-bottom: 0.5em; line-height: 1.7; }
        .ql-editor li:last-child { margin-bottom: 0; }
        .ql-editor blockquote { margin: 1.25em 0; padding: 0.75em 1.25em; border-left: 4px solid #7c3aed; background: #f5f3ff; border-radius: 0 8px 8px 0; }
        .ql-editor pre.ql-syntax { margin: 1.25em 0; padding: 1em; background: #1e293b; color: #e2e8f0; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
        .ql-editor img { max-width: 100%; height: auto; margin: 1.25em 0; border-radius: 8px; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <nav class="bg-white shadow-lg sticky top-0 z-20">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-gray-600 hover:text-purple-600 p-2"><i class="fas fa-arrow-left"></i></a>
                <div class="w-10 h-10 bg-gradient-to-r from-purple-600 to-purple-500 rounded-xl flex items-center justify-center"><i class="fas fa-edit text-white"></i></div>
                <div><h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-purple-500 bg-clip-text text-transparent">Edit Artikel</h1><p class="text-xs text-gray-400" id="articleStatus">-</p></div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="quickSave()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm"><i class="fas fa-save mr-1"></i>Simpan</button>
                <span id="userName" class="text-sm font-semibold hidden sm:inline">Admin</span>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6">
        <div id="loadingState" class="bg-white rounded-xl shadow-md p-8 text-center"><i class="fas fa-spinner fa-spin text-purple-600 text-3xl"></i><p class="mt-2">Memuat...</p></div>
        <div id="errorState" class="hidden bg-white rounded-xl shadow-md p-8 text-center"><i class="fas fa-exclamation-circle text-red-500 text-4xl"></i><h3 class="text-lg font-semibold mt-2">Gagal</h3><p id="errorMessage">-</p><a href="index.html" class="inline-block mt-4 bg-purple-600 text-white px-6 py-2 rounded-lg">Kembali</a></div>

        <div id="editorContainer" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-4">
                    <div class="bg-white rounded-xl shadow-md p-5"><label class="text-sm font-medium">Judul *</label><input type="text" id="articleTitle" class="w-full border rounded-lg px-4 py-2 mt-1 focus:ring-2 focus:ring-purple-500"><div class="flex justify-between mt-3"><label class="text-sm">Slug</label><span class="text-xs text-gray-400">Otomatis</span></div><div class="flex gap-2 mt-1"><input type="text" id="articleSlug" class="flex-1 border rounded-lg px-4 py-2 bg-gray-50"><button onclick="copySlug()" class="bg-gray-100 px-4 py-2 rounded-lg"><i class="fas fa-copy"></i></button><button onclick="generateSlug()" class="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg"><i class="fas fa-sync-alt"></i></button></div></div>
                    
                    <div class="bg-white rounded-xl shadow-md p-5"><label class="text-sm font-medium">Kategori *</label><select id="articleCategory" class="w-full border rounded-lg px-4 py-3 mt-1 focus:ring-2 focus:ring-purple-500"><option value="">-- Pilih --</option><option value="Kabar Gardu">📡 Kabar Gardu</option><option value="Jejak Lapangan">🗺️ Jejak Lapangan</option><option value="Kisah Tetangga">👥 Kisah Tetangga</option><option value="Obrolan Warung">☕ Obrolan Warung</option><option value="Rembuk Warga">💬 Rembuk Warga</option><option value="Sorot Publik">🔦 Sorot Publik</option><option value="Balai Komunitas">🏛️ Balai Komunitas</option><option value="Gerak Bareng">🤝 Gerak Bareng</option><option value="Lapak Lokal">🛍️ Lapak Lokal</option><option value="Cerita Ladang">🌱 Cerita Ladang</option><option value="Denyut Negeri">🌏 Denyut Negeri</option><option value="Gawe Kampung">🔨 Gawe Kampung</option></select></div>
                    
                    <div class="bg-white rounded-xl shadow-md p-5"><div class="flex justify-between"><label class="text-sm font-medium">Konten *</label><button onclick="pasteFromClipboard()" class="text-xs text-purple-600">Paste</button></div><div id="editor" class="mt-2"></div><p class="text-xs text-gray-400 mt-2"><span id="wordCountDisplay">0 kata</span></p></div>
                    <div class="bg-white rounded-xl shadow-md p-5"><div class="flex justify-between"><label class="text-sm font-medium">Excerpt</label><span id="excerptCount">0/160</span></div><textarea id="articleExcerpt" rows="3" class="w-full border rounded-lg px-4 py-2 mt-1 focus:ring-2 focus:ring-purple-500"></textarea></div>
                    <div class="bg-white rounded-xl shadow-md p-5"><label class="text-sm font-medium">Sumber</label><div class="relative mt-1"><i class="fas fa-link absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="url" id="sourceUrl" class="w-full border rounded-lg pl-10 pr-4 py-2 focus:ring-2 focus:ring-purple-500" placeholder="https://..."></div></div>
                </div>
                <div class="space-y-4">
                    <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-semibold mb-3">Info</h3><div class="space-y-2 text-sm"><div class="flex justify-between"><span class="text-gray-500">Status:</span><span id="statusBadge" class="px-2 py-1 rounded-full text-xs font-medium">-</span></div><div class="flex justify-between"><span class="text-gray-500">Kategori:</span><span id="infoCategory">-</span></div><div class="flex justify-between"><span class="text-gray-500">Penulis:</span><span id="infoAuthor">-</span></div><div class="flex justify-between"><span class="text-gray-500">Role:</span><span id="infoRole">-</span></div><div class="flex justify-between"><span class="text-gray-500">Dibuat:</span><span id="infoCreated">-</span></div><div class="flex justify-between"><span class="text-gray-500">Slug:</span><span id="infoSlug" class="font-mono text-xs truncate">-</span></div></div></div>
                    <div id="editorNoteCard" class="bg-purple-50 rounded-xl shadow-md p-5 hidden"><h3 class="font-semibold text-purple-800">Catatan</h3><p id="editorNoteText" class="text-sm text-purple-700"></p></div>
                    <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-semibold mb-3">Gambar</h3><div class="flex border-b mb-3"><button id="tabFile" class="flex-1 py-2 text-sm font-medium text-purple-600 border-b-2 border-purple-600" onclick="switchImageTab('file')">Upload</button><button id="tabUrl" class="flex-1 py-2 text-sm text-gray-500" onclick="switchImageTab('url')">URL</button></div><div id="uploadFileSection"><input type="file" id="imageFile" accept="image/*" class="w-full border rounded-lg p-2 text-sm"><div id="uploadProgress" class="mt-2 hidden"><div class="flex items-center gap-2"><div class="flex-1 bg-gray-200 rounded-full h-2"><div id="progressBar" class="bg-purple-600 h-2 rounded-full" style="width:0%"></div></div><span id="progressText" class="text-xs">0%</span></div></div></div><div id="uploadUrlSection" class="hidden"><input type="text" id="featuredImage" class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="https://..."></div><div class="mt-3"><input type="text" id="imageCaption" class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="Caption"></div><div id="imagePreview" class="mt-3 hidden"><img id="previewImg" class="w-full h-32 object-cover rounded-lg"><p id="previewCaption" class="text-xs text-gray-500 mt-1 text-center italic"></p><button onclick="removeImage()" class="text-red-500 text-xs mt-2">Hapus</button></div></div>
                    <div class="bg-white rounded-xl shadow-md p-5"><label class="flex items-center gap-3"><input type="checkbox" id="isFeatured" class="w-5 h-5 text-purple-600 rounded"><span class="font-medium">Featured</span></label></div>
                    <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-semibold mb-3">Aksi</h3><div id="actionButtons" class="space-y-2"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 hidden"><span id="toastMessage"></span></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        let supabase = null, convertedImageBase64 = null, tempWebPFile = null, currentImageTab = 'file', userId = null, quill = null, articleId = null, articleData = null, hasChanges = false;
        
        async function initSupabase() {
            const r = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(5000) });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const c = await r.json();
            if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
        }
        
        async function convertToWebP(file, q = 0.85) {
            return new Promise((resolve, reject) => {
                const img = new Image(), reader = new FileReader();
                reader.onload = e => img.src = e.target.result;
                img.onload = () => {
                    const c = document.createElement('canvas'), mw = 1200;
                    let w = img.width, h = img.height;
                    if (w > mw) { h = h * (mw / w); w = mw; }
                    c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
                    convertedImageBase64 = c.toDataURL('image/webp', q);
                    document.getElementById('previewImg').src = convertedImageBase64;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    c.toBlob(b => { if (!b) return reject('Gagal'); tempWebPFile = new File([b], file.name.replace(/\.\w+$/, '.webp'), { type: 'image/webp' }); resolve(tempWebPFile); }, 'image/webp', q);
                };
                img.onerror = () => reject('Gagal'); reader.onerror = () => reject('Gagal'); reader.readAsDataURL(file);
            });
        }
        
        async function uploadImageToStorage(file) {
            const fn = `article-images/${userId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
            const { error } = await supabase.storage.from('articles').upload(fn, file, { cacheControl: '3600', upsert: false });
            if (error) throw error;
            return supabase.storage.from('articles').getPublicUrl(fn).data.publicUrl;
        }
        
        async function checkUser() {
            if (!supabase) return false;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '../../../auth/login.html'; return false; }
            const { data: p } = await supabase.from('profiles').select('role, full_name').eq('id', session.user.id).single();
            if (p?.role !== 'admin') { window.location.href = '../../../auth/login.html'; return false; }
            userId = session.user.id;
            document.getElementById('userName').textContent = p?.full_name || 'Admin';
            return true;
        }
        
        function getArticleId() { return new URLSearchParams(window.location.search).get('id'); }
        
        // ===== ENHANCED QUILL INIT =====
        function initQuill() { 
            if (quill) return; 
            
            // Override default tag DIV → P
            const Block = Quill.import('blots/block');
            Block.tagName = 'P';
            Quill.register(Block, true);
            
            quill = new Quill('#editor', { theme: 'snow', placeholder: 'Tulis...', modules: { toolbar: [['bold','italic','underline'],['blockquote'],[{header:1},{header:2}],[{list:'ordered'},{'list':'bullet'}],['clean'],['link']] } }); 
            quill.on('text-change', () => { updateWordCount(); hasChanges = true; }); 
            
            // Shift+Enter = line break, Enter = new paragraph
            quill.keyboard.addBinding({ key: 13, shiftKey: true }, function(range, context) {
                quill.insertText(range.index, '\n');
                return false;
            });
        }
        function updateWordCount() { if (!quill) return; document.getElementById('wordCountDisplay').textContent = `${quill.getText().trim().split(/\s+/).filter(w => w.length > 0).length} kata`; }
        
        async function loadArticle() {
            articleId = getArticleId();
            if (!articleId) { showError('ID tidak ditemukan'); return; }
            const { data, error } = await supabase.from('article_index').select('*').eq('id', articleId).single();
            if (error || !data) { showError('Tidak ditemukan'); return; }
            articleData = data;
            document.getElementById('articleTitle').value = data.title || '';
            document.getElementById('articleSlug').value = data.slug || '';
            document.getElementById('articleCategory').value = data.category || 'Kabar Gardu';
            document.getElementById('articleExcerpt').value = data.excerpt || '';
            document.getElementById('featuredImage').value = data.featured_image || '';
            document.getElementById('imageCaption').value = data.image_caption || '';
            document.getElementById('sourceUrl').value = data.source_url || '';
            document.getElementById('isFeatured').checked = data.is_featured || false;
            document.getElementById('excerptCount').textContent = `${(data.excerpt || '').length}/160`;
            if (data.content) quill.root.innerHTML = data.content;
            if (data.featured_image) { document.getElementById('previewImg').src = data.featured_image; document.getElementById('previewCaption').textContent = data.image_caption || ''; document.getElementById('imagePreview').classList.remove('hidden'); }
            updateArticleInfo(data); updateStatusBadge(data.status); renderActionButtons(data);
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('editorContainer').classList.remove('hidden');
        }
        
        function showError(m) { document.getElementById('loadingState').classList.add('hidden'); document.getElementById('errorState').classList.remove('hidden'); document.getElementById('errorMessage').textContent = m; }
        function updateArticleInfo(d) {
            document.getElementById('infoCategory').textContent = d.category || '-';
            document.getElementById('infoAuthor').textContent = d.author_name || '-';
            document.getElementById('infoRole').textContent = { user: 'User', member: 'Member', editor: 'Editor', admin: 'Admin' }[d.author_role] || '-';
            document.getElementById('infoCreated').textContent = d.created_at ? new Date(d.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
            document.getElementById('infoSlug').textContent = d.slug || '-';
            if (d.editor_note) { document.getElementById('editorNoteText').textContent = d.editor_note; document.getElementById('editorNoteCard').classList.remove('hidden'); }
            document.getElementById('articleStatus').textContent = `Status: ${getStatusLabel(d.status)}`;
        }
        
        function updateStatusBadge(s) {
            const b = { draft: 'bg-gray-100 text-gray-800', pending_editor: 'bg-yellow-100 text-yellow-800', published: 'bg-green-100 text-green-800', rejected: 'bg-red-100 text-red-800', archived: 'bg-gray-200 text-gray-600' };
            const el = document.getElementById('statusBadge'); el.className = `px-2 py-1 rounded-full text-xs font-medium ${b[s] || b.draft}`; el.textContent = getStatusLabel(s);
        }
        
        function getStatusLabel(s) { const l = { draft: 'Draft', pending_editor: 'Pending', published: 'Published', rejected: 'Ditolak', archived: 'Arsip' }; return l[s] || s; }
        
        function renderActionButtons(d) {
            const c = document.getElementById('actionButtons'), s = d.status, own = d.author_role === 'admin';
            if (s === 'published') c.innerHTML = `<button onclick="unpublishArticle()" class="action-btn w-full bg-yellow-600 text-white py-2.5 rounded-lg">Unpublish</button><hr><button onclick="quickSave()" class="action-btn w-full bg-gray-100 border py-2.5 rounded-lg">Simpan</button><button onclick="previewArticle()" class="action-btn w-full bg-blue-100 text-blue-700 py-2.5 rounded-lg">Preview</button>${own ? `<a href="https://postingan.poswarga.com/posts/${d.slug}" target="_blank" class="action-btn w-full bg-green-100 text-green-700 py-2.5 rounded-lg">Lihat Web</a>` : ''}<a href="index.html" class="action-btn w-full bg-gray-50 py-2.5 rounded-lg">Kembali</a>`;
            else if (s === 'draft') c.innerHTML = `<button onclick="publishArticle()" class="action-btn w-full bg-green-600 text-white py-2.5 rounded-lg">Publish</button><hr><button onclick="quickSave()" class="action-btn w-full bg-gray-100 border py-2.5 rounded-lg">Simpan</button><button onclick="previewArticle()" class="action-btn w-full bg-blue-100 text-blue-700 py-2.5 rounded-lg">Preview</button><a href="index.html" class="action-btn w-full bg-gray-50 py-2.5 rounded-lg">Kembali</a>`;
            else c.innerHTML = `<button onclick="quickSave()" class="action-btn w-full bg-gray-100 border py-2.5 rounded-lg">Simpan</button><hr><button onclick="previewArticle()" class="action-btn w-full bg-blue-100 text-blue-700 py-2.5 rounded-lg">Preview</button><a href="index.html" class="action-btn w-full bg-gray-50 py-2.5 rounded-lg">Kembali</a>`;
        }
        
        window.switchImageTab = t => { currentImageTab = t; document.getElementById('tabFile').className = t === 'file' ? 'flex-1 py-2 text-sm font-medium text-purple-600 border-b-2 border-purple-600' : 'flex-1 py-2 text-sm text-gray-500'; document.getElementById('tabUrl').className = t === 'url' ? 'flex-1 py-2 text-sm font-medium text-purple-600 border-b-2 border-purple-600' : 'flex-1 py-2 text-sm text-gray-500'; document.getElementById('uploadFileSection').classList.toggle('hidden', t !== 'file'); document.getElementById('uploadUrlSection').classList.toggle('hidden', t !== 'url'); };
        
        document.getElementById('imageFile')?.addEventListener('change', async e => { const f = e.target.files[0]; if (f) { try { await convertToWebP(f, 0.85); showToast('Gambar siap', 'success'); } catch (err) { const r = new FileReader(); r.onload = e => { convertedImageBase64 = e.target.result; document.getElementById('previewImg').src = e.target.result; document.getElementById('imagePreview').classList.remove('hidden'); }; r.readAsDataURL(f); } } });
        document.getElementById('featuredImage')?.addEventListener('input', e => { if (e.target.value) { document.getElementById('previewImg').src = e.target.value; document.getElementById('imagePreview').classList.remove('hidden'); } });
        document.getElementById('imageCaption')?.addEventListener('input', function() { const el = document.getElementById('previewCaption'); if (el) el.textContent = this.value; });
        window.removeImage = () => { document.getElementById('featuredImage').value = ''; document.getElementById('imageFile').value = ''; document.getElementById('imageCaption').value = ''; document.getElementById('imagePreview').classList.add('hidden'); const el = document.getElementById('previewCaption'); if (el) el.textContent = ''; convertedImageBase64 = null; tempWebPFile = null; };
        
        window.generateSlug = () => { 
            const t = document.getElementById('articleTitle').value; 
            if (t) document.getElementById('articleSlug').value = t.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-+|-+$/g, ''); 
        };
        window.copySlug = () => { const s = document.getElementById('articleSlug'); if (!s.value) window.generateSlug(); s.select(); navigator.clipboard?.writeText(s.value) || document.execCommand('copy'); showToast('Disalin!'); };
        window.pasteFromClipboard = async () => { try { const t = await navigator.clipboard.readText(); if (t) { quill.root.innerHTML = t.includes('<') ? t : t.split('\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join(''); updateWordCount(); showToast('Ditempel!'); } } catch (e) { showToast('Gagal', 'error'); } };
        
        document.getElementById('articleTitle')?.addEventListener('input', () => { window.generateSlug(); hasChanges = true; });
        document.getElementById('articleCategory')?.addEventListener('change', () => hasChanges = true);
        document.getElementById('articleExcerpt')?.addEventListener('input', e => { document.getElementById('excerptCount').textContent = `${e.target.value.length}/160`; hasChanges = true; });
        
        async function getFormData() {
            if (!document.getElementById('articleSlug').value) window.generateSlug();
            let img = articleData?.featured_image || null;
            if (currentImageTab === 'file') { let f = tempWebPFile || document.getElementById('imageFile').files[0]; if (f) { try { document.getElementById('uploadProgress').classList.remove('hidden'); if (!tempWebPFile) { document.getElementById('progressText').textContent = 'Konversi...'; document.getElementById('progressBar').style.width = '30%'; f = await convertToWebP(f, 0.85); } document.getElementById('progressText').textContent = 'Upload...'; document.getElementById('progressBar').style.width = '70%'; img = await uploadImageToStorage(f); document.getElementById('progressBar').style.width = '100%'; document.getElementById('uploadProgress').classList.add('hidden'); } catch (e) { document.getElementById('uploadProgress').classList.add('hidden'); throw e; } } }
            else { img = document.getElementById('featuredImage').value || null; }
            return { title: document.getElementById('articleTitle').value.trim(), slug: document.getElementById('articleSlug').value, excerpt: document.getElementById('articleExcerpt').value.trim(), content: quill.root.innerHTML, category: document.getElementById('articleCategory').value, featured_image: img, image_caption: document.getElementById('imageCaption').value || null, source_url: document.getElementById('sourceUrl').value || null, is_featured: document.getElementById('isFeatured').checked, file_path: img, updated_at: new Date().toISOString() };
        }
        
        window.quickSave = async () => { try { const fd = await getFormData(); if (!fd.category) fd.category = 'Kabar Gardu'; const { error } = await supabase.from('article_index').update(fd).eq('id', articleId); if (error) throw error; showToast('Disimpan'); hasChanges = false; } catch (e) { showToast(e.message, 'error'); } };
        window.publishArticle = async () => { const r = await Swal.fire({ title: 'Publish?', icon: 'question', showCancelButton: true, confirmButtonText: 'Ya', cancelButtonText: 'Batal' }); if (!r.isConfirmed) return; try { const fd = await getFormData(); fd.status = 'published'; fd.published_at = new Date().toISOString(); const { error } = await supabase.from('article_index').update(fd).eq('id', articleId); if (error) throw error; Swal.fire({ icon: 'success', title: 'Dipublish!', timer: 1500 }); hasChanges = false; setTimeout(() => window.location.reload(), 1500); } catch (e) { Swal.fire({ icon: 'error', text: e.message }); } };
        window.unpublishArticle = async () => { const r = await Swal.fire({ title: 'Unpublish?', icon: 'question', showCancelButton: true }); if (!r.isConfirmed) return; await supabase.from('article_index').update({ status: 'draft' }).eq('id', articleId); Swal.fire({ icon: 'success', title: 'Unpublished', timer: 1500 }); setTimeout(() => window.location.reload(), 1000); };
        window.previewArticle = () => { let img = null; if (currentImageTab === 'file') { img = convertedImageBase64; if (!img) { const f = document.getElementById('imageFile').files[0]; if (f) { const r = new FileReader(); r.readAsDataURL(f); } } } else { img = document.getElementById('featuredImage').value || articleData?.featured_image || null; } localStorage.setItem('preview_article', JSON.stringify({ title: document.getElementById('articleTitle').value || articleData?.title || 'Tanpa Judul', content: quill?.root.innerHTML || '', excerpt: document.getElementById('articleExcerpt').value || articleData?.excerpt || '', category: document.getElementById('articleCategory').value || articleData?.category || 'Kabar Gardu', image: img, caption: document.getElementById('imageCaption').value || articleData?.image_caption || '' })); window.open('preview.html', '_blank'); };
        
        function showToast(m, t = 'success') { const toast = document.getElementById('toast'), msg = document.getElementById('toastMessage'); toast.classList.remove('bg-green-500', 'bg-red-500', 'bg-blue-500'); toast.classList.add(t === 'success' ? 'bg-green-500' : t === 'error' ? 'bg-red-500' : 'bg-blue-500'); msg.textContent = m; toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 3000); }
        window.logout = async () => { if (supabase) await supabase.auth.signOut(); window.location.href = '../../../auth/login.html'; };
        window.addEventListener('beforeunload', e => { if (hasChanges) { e.preventDefault(); e.returnValue = ''; } });
        
        (async () => { 
            try { await initSupabase(); } catch (e) { window.location.href = '../../../auth/login.html'; return; } 
            if (await checkUser()) { initQuill(); await loadArticle(); quill?.on('text-change', () => hasChanges = true); } 
        })();
    </script>
</body>
