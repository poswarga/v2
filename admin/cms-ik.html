<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageKit CMS - Kelola Media</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- ImageKit Widget -->
    <script src="https://unpkg.com/imagekit-media-library-widget/dist/imagekit-media-library-widget.min.js"></script>

    <style>
        body {
            overflow-x: hidden;
        }

        /* ===== MEDIA LIBRARY FIX ===== */
        .media-wrapper {
            height: calc(100vh - 140px);
            min-height: 420px;
            overflow: hidden;
            border-radius: 12px;
        }

        #media-library-container {
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        /* Smooth scroll */
        #media-library-container::-webkit-scrollbar {
            width: 6px;
        }

        /* ===== UI ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .toast.show { transform: translateX(0); }

        .transform-chip {
            display: inline-block;
            background: #f3f4f6;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .transform-chip:hover {
            background: #dbeafe;
            color: #2563eb;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100">

<!-- NAVBAR -->
<nav class="bg-white shadow-lg p-4 flex justify-between items-center sticky top-0 z-20 border-b border-gray-100">
    <div class="flex items-center gap-3">
        <a href="dashboard.html" class="text-gray-600 hover:text-blue-600 transition p-2 rounded-lg hover:bg-blue-50" title="Kembali ke Dashboard">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="font-bold bg-gradient-to-r from-blue-600 to-blue-500 bg-clip-text text-transparent">
            <i class="fas fa-image mr-2"></i>ImageKit CMS
        </h1>
    </div>
    <div class="flex items-center gap-2">
        <!-- Tombol Beranda - NEW -->
        <a href="../index.html" class="text-gray-600 hover:text-blue-600 transition p-2 rounded-lg hover:bg-blue-50" title="Ke Beranda">
            <i class="fas fa-home"></i>
        </a>
        <button onclick="refreshMediaLibrary()" class="text-gray-600 hover:text-blue-600 transition p-2 rounded-lg hover:bg-blue-50" title="Refresh Media Library">
            <i class="fas fa-sync-alt"></i>
        </button>
        <a href="https://imagekit.io/dashboard" target="_blank" class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 transition shadow-md">
            <i class="fas fa-external-link-alt mr-1"></i>Buka ImageKit
        </a>
    </div>
</nav>

<!-- MEDIA LIBRARY -->
<div class="container mx-auto p-4">
    <div class="bg-white rounded-xl shadow-md p-4 border border-gray-100">
        <h3 class="font-semibold mb-3 text-gray-800 flex items-center gap-2">
            <i class="fas fa-folder-open text-blue-600"></i>📁 Media Library
        </h3>

        <div class="media-wrapper">
            <div id="media-library-container"></div>
        </div>

    </div>
</div>

<!-- MAIN -->
<div class="container mx-auto p-4 grid md:grid-cols-2 gap-4">

    <!-- LEFT -->
    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
        <h3 class="mb-2 font-semibold text-gray-800 flex items-center gap-2">
            <i class="fas fa-link text-blue-600"></i>URL Media
        </h3>

        <input id="imageUrl" class="w-full border border-gray-200 p-2 rounded-lg mb-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="URL otomatis dari media library">

        <div class="flex gap-2 mb-2">
            <button onclick="copyUrl()" class="bg-blue-600 text-white px-3 py-1 rounded-lg hover:bg-blue-700 transition shadow-sm"><i class="fas fa-copy mr-1"></i>Copy</button>
            <button onclick="clearUrl()" class="bg-gray-500 text-white px-3 py-1 rounded-lg hover:bg-gray-600 transition shadow-sm"><i class="fas fa-times mr-1"></i>Clear</button>
        </div>

        <img id="preview" class="max-h-48 hidden mx-auto rounded-lg border border-gray-200">

        <!-- Transform -->
        <div class="mt-3 flex flex-wrap gap-2">
            <span class="transform-chip"><i class="fas fa-arrows-alt-h mr-1"></i>w-200</span>
            <span class="transform-chip" onclick="applyTransform('h-200')"><i class="fas fa-arrows-alt-v mr-1"></i>h-200</span>
            <span class="transform-chip" onclick="applyTransform('f-webp')"><i class="fas fa-image mr-1"></i>webp</span>
            <span class="transform-chip" onclick="applyTransform('w-400,h-300')"><i class="fas fa-crop mr-1"></i>400x300</span>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
                <i class="fas fa-history text-blue-600"></i>Recent
            </h3>
            <!-- Tombol Clear Recent - NEW -->
            <button onclick="clearRecent()" class="text-xs text-red-500 hover:text-red-700 transition p-1 rounded hover:bg-red-50" title="Hapus Riwayat">
                <i class="fas fa-trash-alt mr-1"></i>Clear
            </button>
        </div>
        <div id="recent"></div>
    </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast">OK</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ========== AUTH CHECK: ADMIN ONLY ==========
const API_URL = 'https://api.poswarga.com/api/config';

async function checkAdminAccess() {
    try {
        const configRes = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (!configRes.ok) throw new Error('Config error');
        const config = await configRes.json();
        
        const supabase = createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
        const { data: { session } } = await supabase.auth.getSession();
        
        if (!session) {
            window.location.href = '../auth/login.html';
            return false;
        }
        
        const { data: profile } = await supabase
            .from('profiles')
            .select('role')
            .eq('id', session.user.id)
            .single();
        
        if (profile?.role !== 'admin') {
            // Redirect ke dashboard sesuai role
            const redirects = {
                editor: '../editor/dashboard.html',
                member: '../member/dashboard.html',
                user: '../user/dashboard.html'
            };
            window.location.href = redirects[profile?.role] || '../auth/login.html';
            return false;
        }
        
        return true;
    } catch (e) {
        window.location.href = '../auth/login.html';
        return false;
    }
}

// ========== JALANKAN AUTH CHECK DULU ==========
const isAdmin = await checkAdminAccess();
if (!isAdmin) throw new Error('Akses ditolak');

// ========== HANYA JALAN KALAU ADMIN ==========
</script>

<script>
const PUBLIC_KEY = "ISI_PUBLIC_KEY_LO";
const URL_ENDPOINT = "https://ik.imagekit.io/USERNAME_LO";

let mediaWidget = null;

// ================= MEDIA LIBRARY =================
function initMediaLibrary() {
    if (mediaWidget) {
        return;
    }
    
    mediaWidget = new IKMediaLibraryWidget({
        container: "#media-library-container",
        view: "inline",
        publicKey: PUBLIC_KEY,
        urlEndpoint: URL_ENDPOINT,
        renderOpenButton: false
    }, function(payload){
        if(payload.event === "selection"){
            const file = payload.data[0];

            document.getElementById("imageUrl").value = file.url;
            updatePreview(file.url);
            saveRecent(file.url);
            showToast("✅ File dipilih");

            // scroll ke input biar UX enak
            document.getElementById("imageUrl").scrollIntoView({ behavior: "smooth" });
        }
    });
}

// ================= REFRESH MEDIA LIBRARY =================
function refreshMediaLibrary() {
    showToast("🔄 Refresh media library...");
    
    // Destroy widget if exists
    if (mediaWidget) {
        mediaWidget = null;
    }
    
    // Clear container
    document.getElementById("media-library-container").innerHTML = '';
    
    // Reinitialize
    setTimeout(() => {
        initMediaLibrary();
        showToast("✅ Media library refreshed");
    }, 100);
}

// ================= RESIZE FIX =================
function setMediaHeight(){
    const el = document.querySelector(".media-wrapper");
    const offset = 140;
    el.style.height = (window.innerHeight - offset) + "px";
}

window.addEventListener("resize", setMediaHeight);
window.addEventListener("load", setMediaHeight);

// ================= CORE =================
function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2000);
}

function copyUrl(){
    const val = imageUrl.value;
    if(!val) return showToast("⚠️ URL kosong");
    navigator.clipboard.writeText(val);
    showToast("📋 Copied!");
}

function clearUrl(){
    imageUrl.value="";
    preview.classList.add("hidden");
}

// ================= PREVIEW =================
function updatePreview(url){
    if(!url) return;
    preview.src = url;
    preview.classList.remove("hidden");
}

// ================= TRANSFORM =================
function applyTransform(tr){
    let url = imageUrl.value;
    if(!url) return showToast("⚠️ Isi URL dulu");

    url = url.split("?")[0] + "?tr=" + tr;
    imageUrl.value = url;
    updatePreview(url);
    saveRecent(url);
    showToast("✨ Transform applied");
}

// ================= RECENT =================
function saveRecent(url){
    let r = JSON.parse(localStorage.getItem("recent_ik")||"[]");
    r.unshift(url);
    r = [...new Set(r)].slice(0,8); // Maksimal 8 item
    localStorage.setItem("recent_ik", JSON.stringify(r));
    loadRecent();
}

function loadRecent(){
    let r = JSON.parse(localStorage.getItem("recent_ik")||"[]");
    const el = document.getElementById("recent");

    if (r.length === 0) {
        el.innerHTML = '<p class="text-gray-400 text-sm text-center py-4"><i class="fas fa-history mr-1"></i>Belum ada riwayat</p>';
        return;
    }

    el.innerHTML = r.map(u=>`
        <div class="text-xs cursor-pointer mb-1 p-2 rounded-lg text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition flex justify-between items-center group"
            onclick="useUrl('${u}')">
            <span class="truncate flex-1">${u}</span>
            <i class="fas fa-copy opacity-0 group-hover:opacity-100 text-gray-400 hover:text-blue-600" onclick="event.stopPropagation(); copyRecentUrl('${u}')"></i>
        </div>
    `).join("");
}

function useUrl(u){
    imageUrl.value = u;
    updatePreview(u);
    showToast("📋 URL dimuat");
}

function copyRecentUrl(u){
    navigator.clipboard.writeText(u);
    showToast("📋 URL disalin");
}

// Clear Recent - NEW
function clearRecent(){
    if (confirm('Hapus semua riwayat recent?')) {
        localStorage.removeItem("recent_ik");
        loadRecent();
        showToast("🗑️ Riwayat dihapus");
    }
}

// Make clearRecent global
window.clearRecent = clearRecent;
window.copyRecentUrl = copyRecentUrl;

// init
loadRecent();
initMediaLibrary();
</script>

</body>
</html>
