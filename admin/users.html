<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Kelola User - Admin POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @media (max-width: 768px) { 
            button, .btn-touch { min-height: 44px; min-width: 44px; } 
            input, select, textarea { font-size: 16px !important; padding: 12px !important; } 
        }
        .user-card { transition: all 0.2s ease; }
        .user-card:active { transform: scale(0.98); }
        .role-admin { background-color: #fee2e2 !important; color: #991b1b !important; }
        .role-editor { background-color: #e0e7ff !important; color: #3730a3 !important; }
        .role-member { background-color: #dcfce7 !important; color: #166534 !important; }
        .role-user { background-color: #f3e8ff !important; color: #6b21a8 !important; }
        .btn-icon { 
            min-width: 36px; min-height: 36px; 
            display: inline-flex; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">
    <main class="pb-6">
        <!-- NAVBAR -->
        <nav class="bg-white shadow-lg sticky top-0 z-10 border-b border-gray-100">
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <a href="dashboard.html" class="text-gray-600 hover:text-purple-600 p-2 rounded-full hover:bg-purple-50 transition">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-purple-600 to-purple-500 bg-clip-text text-transparent">
                        <i class="fas fa-users mr-2"></i>Kelola User
                    </h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="refreshData()" id="refreshBtn" class="text-gray-500 hover:text-purple-600 p-2 rounded-full hover:bg-gray-100 transition">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <span id="adminEmail" class="text-gray-600 text-sm hidden sm:inline"></span>
                    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-red-600 transition shadow-md">
                        <i class="fas fa-sign-out-alt"></i><span class="hidden sm:inline ml-1">Logout</span>
                    </button>
                </div>
            </div>
        </nav>
        
        <div class="container mx-auto px-3 md:px-6 py-4 md:py-6">
            <!-- STATS -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
                <div class="bg-white rounded-xl shadow-md p-4">
                    <div class="flex items-center justify-between">
                        <div><p class="text-xs text-gray-500">Total</p><p class="text-2xl font-bold text-purple-600" id="statTotal">0</p></div>
                        <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center"><i class="fas fa-users text-purple-600"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-md p-4">
                    <div class="flex items-center justify-between">
                        <div><p class="text-xs text-gray-500">Admin</p><p class="text-2xl font-bold text-red-600" id="statAdmin">0</p></div>
                        <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center"><i class="fas fa-crown text-red-600"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-md p-4">
                    <div class="flex items-center justify-between">
                        <div><p class="text-xs text-gray-500">Editor</p><p class="text-2xl font-bold text-indigo-600" id="statEditor">0</p></div>
                        <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center"><i class="fas fa-pen-fancy text-indigo-600"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-md p-4">
                    <div class="flex items-center justify-between">
                        <div><p class="text-xs text-gray-500">Member</p><p class="text-2xl font-bold text-green-600" id="statMember">0</p></div>
                        <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center"><i class="fas fa-star text-green-600"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-md p-4">
                    <div class="flex items-center justify-between">
                        <div><p class="text-xs text-gray-500">User</p><p class="text-2xl font-bold text-purple-600" id="statUser">0</p></div>
                        <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center"><i class="fas fa-user text-purple-600"></i></div>
                    </div>
                </div>
            </div>
            
            <!-- FORM TAMBAH/EDIT USER -->
            <div class="bg-white rounded-xl shadow-md p-4 md:p-6 mb-6">
                <h2 id="formTitle" class="text-lg md:text-xl font-bold mb-4">
                    <i class="fas fa-user-plus text-purple-600 mr-2"></i>Tambah User Baru
                </h2>
                <form id="userForm" onsubmit="submitUser(event)">
                    <div id="formMessage" class="mb-4"></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">Nama Lengkap *</label>
                            <input type="text" id="userFullName" required 
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition" 
                                placeholder="Masukkan nama lengkap">
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">Email *</label>
                            <input type="email" id="userEmail" required 
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition" 
                                placeholder="Masukkan alamat email">
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">
                                <i class="fas fa-tag text-green-600 mr-1"></i>Alias
                            </label>
                            <input type="text" id="userAlias" 
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 transition" 
                                placeholder="Nama panggilan (opsional)">
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">
                                <i class="fas fa-briefcase text-purple-600 mr-1"></i>Jabatan
                            </label>
                            <input type="text" id="userJabatan" 
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition" 
                                placeholder="Jabatan (opsional)">
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">Nomor Telepon</label>
                            <input type="tel" id="userPhone" 
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition" 
                                placeholder="Masukkan nomor telepon">
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">Password *</label>
                            <input type="password" id="userPassword" 
                                placeholder="Password (wajib untuk user baru)" required
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition">
                            <p class="text-xs text-gray-400 mt-1">Minimal 6 karakter</p>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">Role</label>
                            <select id="userRole" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition">
                                <option value="user">👤 User (Warga)</option>
                                <option value="member">⭐ Member (Pewarta)</option>
                                <option value="editor">✏️ Editor (Redaktur)</option>
                                <option value="admin">👑 Admin (Administrator)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2 text-sm font-medium">Status</label>
                            <select id="userIsActive" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 transition">
                                <option value="true">✅ Aktif</option>
                                <option value="false">❌ Nonaktif</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-6 flex gap-3">
                        <button type="submit" id="submitBtn" class="flex-1 bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition font-medium shadow-md">
                            <i class="fas fa-save mr-1"></i> Simpan
                        </button>
                        <button type="button" onclick="resetForm()" class="flex-1 bg-gray-500 text-white py-3 rounded-lg hover:bg-gray-600 transition font-medium shadow-md">
                            <i class="fas fa-undo-alt mr-1"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- DAFTAR USER -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="px-5 py-4 border-b bg-gray-50 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-list text-purple-600"></i>
                        <h2 class="font-semibold">Daftar User</h2>
                        <span class="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded-full" id="userCount">0</span>
                    </div>
                    <button onclick="refreshData()" class="text-sm text-purple-600 hover:text-purple-800">
                        <i class="fas fa-sync-alt mr-1"></i>Refresh
                    </button>
                </div>
                
                <!-- DESKTOP TABLE -->
                <div class="overflow-x-auto hidden md:block">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">ID</th>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Nama</th>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Email</th>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Phone</th>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Role</th>
                                <th class="py-3 px-4 text-center text-xs font-semibold text-gray-500 uppercase">Artikel</th>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                                <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="8" class="text-center py-8 text-gray-400">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- MOBILE CARDS -->
                <div id="usersCardList" class="block md:hidden p-4">
                    <div class="text-center py-8 text-gray-400">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        
        const API_URL = 'https://api.poswarga.com/api/config';
        const EDGE_FUNCTION_URL = 'https://oavxhkpdqgqnagblxhki.supabase.co/functions/v1/admin-reset-password';
        let supabase = null;
        let adminSessionBackup = null;
        
        // =============================================
        // INIT SUPABASE
        // =============================================
        async function initSupabase() {
            const r = await fetch(API_URL, { 
                method: 'GET', 
                headers: { 'Accept': 'application/json' }, 
                signal: AbortSignal.timeout(5000) 
            });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const c = await r.json();
            if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) throw new Error('Konfigurasi server tidak lengkap');
            supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
        }
        
        // =============================================
        // AUTH CHECK
        // =============================================
        async function requireAdmin() {
            if (!supabase) return null;
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { 
                window.location.href = '../../auth/login.html'; 
                return null; 
            }
            adminSessionBackup = session;
            
            const { data: p } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();
                
            if (!p || p.role !== 'admin') { 
                await supabase.auth.signOut(); 
                window.location.href = '../../auth/login.html'; 
                return null; 
            }
            return session;
        }
        
        async function restoreAdminSession() { 
            if (adminSessionBackup) {
                await supabase.auth.setSession({ 
                    access_token: adminSessionBackup.access_token, 
                    refresh_token: adminSessionBackup.refresh_token 
                }); 
            }
        }
        
        // =============================================
        // STATE
        // =============================================
        let currentEditId = null;
        let currentUsers = [];
        let articleCounts = {};
        
        // =============================================
        // STATS
        // =============================================
        function updateStats() {
            document.getElementById('statTotal').textContent = currentUsers.length;
            document.getElementById('statAdmin').textContent = currentUsers.filter(u => u.role === 'admin').length;
            document.getElementById('statEditor').textContent = currentUsers.filter(u => u.role === 'editor').length;
            document.getElementById('statMember').textContent = currentUsers.filter(u => u.role === 'member').length;
            document.getElementById('statUser').textContent = currentUsers.filter(u => u.role === 'user').length;
            document.getElementById('userCount').textContent = currentUsers.length;
        }
        
        // =============================================
        // LOAD DATA
        // =============================================
        async function loadArticleCounts() {
            if (!supabase) return;
            const { data } = await supabase
                .from('article_index')
                .select('author_id, status')
                .eq('status', 'published');
            articleCounts = {}; 
            (data || []).forEach(a => { 
                if (a.author_id) articleCounts[a.author_id] = (articleCounts[a.author_id] || 0) + 1; 
            });
        }
        
        async function loadUsers() {
            if (!supabase) return;
            await loadArticleCounts();
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('created_at', { ascending: false });
                
            if (error) { 
                Swal.fire({ icon: 'error', title: 'Gagal', text: error.message }); 
                return; 
            }
            currentUsers = data || []; 
            updateStats(); 
            renderDesktopTable(data); 
            renderMobileCards(data);
        }
        
        // =============================================
        // HELPERS
        // =============================================
        function getRoleBadge(role) {
            const badges = { 
                admin:  { class: 'role-admin',  icon: 'fa-crown',      text: 'Admin' }, 
                editor: { class: 'role-editor', icon: 'fa-pen-fancy',  text: 'Editor' }, 
                member: { class: 'role-member', icon: 'fa-star',       text: 'Member' }, 
                user:   { class: 'role-user',   icon: 'fa-user',       text: 'User' } 
            };
            const b = badges[role] || badges.user; 
            return `<span class="px-2 py-1 rounded text-xs font-medium ${b.class}">
                <i class="fas ${b.icon} mr-1"></i>${b.text}
            </span>`;
        }
        
        function getArticleCount(uid) { 
            return articleCounts[uid] || 0; 
        }
        
        function escapeHtml(s) { 
            if (!s) return '';
            return String(s).replace(/[&<>]/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;'
            })[m]); 
        }
        
        // =============================================
        // API CALL: Reset Password via Edge Function
        // =============================================
        async function callResetPasswordAPI(userId, newPassword) {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) throw new Error('Session tidak ditemukan, silakan login ulang');
            
            const response = await fetch(EDGE_FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${session.access_token}`
                },
                body: JSON.stringify({
                    target_user_id: userId,
                    new_password: newPassword
                })
            });
            
            const result = await response.json();
            
            if (!response.ok) {
                throw new Error(result.error || 'Gagal mereset password');
            }
            
            return result;
        }
        
        // =============================================
        // RENDER DESKTOP TABLE
        // =============================================
        function renderDesktopTable(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!tbody) return;
            
            if (!users || !users.length) { 
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-400">Belum ada user</td></tr>'; 
                return; 
            }
            
            tbody.innerHTML = users.map(u => {
                const ac = getArticleCount(u.id);
                const safeName = escapeHtml(u.full_name || '-');
                const safeAlias = u.alias ? escapeHtml(u.alias) : '';
                const safeJabatan = u.jabatan ? escapeHtml(u.jabatan) : '';
                
                return `
                <tr class="border-b hover:bg-purple-50 transition">
                    <td class="py-3 px-2 text-xs text-gray-500 font-mono">${(u.id || '').substring(0, 8)}...</td>
                    <td class="py-3 px-2 font-medium">
                        <div>${safeName}</div>
                        ${safeAlias ? `<div class="text-xs text-green-600"><i class="fas fa-tag mr-1"></i>@${safeAlias}</div>` : ''}
                        ${safeJabatan ? `<div class="text-xs text-purple-600"><i class="fas fa-briefcase mr-1"></i>${safeJabatan}</div>` : ''}
                    </td>
                    <td class="py-3 px-2 text-sm text-gray-600">${escapeHtml(u.email || '-')}</td>
                    <td class="py-3 px-2 text-sm text-gray-600">${u.phone || '-'}</td>
                    <td class="py-3 px-2">${getRoleBadge(u.role)}</td>
                    <td class="py-3 px-2 text-center">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${ac > 0 ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'}">
                            <i class="fas fa-newspaper mr-1"></i>${ac}
                        </span>
                    </td>
                    <td class="py-3 px-2">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${u.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${u.is_active ? '✅ Aktif' : '❌ Nonaktif'}
                        </span>
                    </td>
                    <td class="py-3 px-2 whitespace-nowrap">
                        <div class="flex gap-1">
                            <button onclick="toggleUserStatus('${u.id}', ${!u.is_active})" 
                                class="btn-icon bg-${u.is_active ? 'yellow' : 'green'}-500 text-white px-2 py-1 rounded text-xs hover:opacity-80 transition"
                                title="${u.is_active ? 'Nonaktifkan' : 'Aktifkan'}">
                                <i class="fas fa-${u.is_active ? 'ban' : 'check-circle'}"></i>
                            </button>
                            <button onclick="editUser('${u.id}')" 
                                class="btn-icon bg-blue-500 text-white px-2 py-1 rounded text-xs hover:opacity-80 transition"
                                title="Edit User">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="changePassword('${u.id}', '${safeName}')" 
                                class="btn-icon bg-purple-500 text-white px-2 py-1 rounded text-xs hover:opacity-80 transition"
                                title="Ganti Password">
                                <i class="fas fa-key"></i>
                            </button>
                            <button onclick="deleteUser('${u.id}', '${safeName}')" 
                                class="btn-icon bg-red-500 text-white px-2 py-1 rounded text-xs hover:opacity-80 transition"
                                title="Hapus User">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }
        
        // =============================================
        // RENDER MOBILE CARDS
        // =============================================
        function renderMobileCards(users) {
            const container = document.getElementById('usersCardList');
            if (!container) return;
            
            if (!users || !users.length) { 
                container.innerHTML = '<div class="text-center py-8 text-gray-400">Belum ada user</div>'; 
                return; 
            }
            
            container.innerHTML = users.map(u => {
                const ac = getArticleCount(u.id);
                const safeName = escapeHtml(u.full_name || '-');
                const safeAlias = u.alias ? escapeHtml(u.alias) : '';
                const safeJabatan = u.jabatan ? escapeHtml(u.jabatan) : '';
                
                return `
                <div class="user-card bg-white rounded-lg shadow-md p-4 mb-3 border border-gray-100">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-lg truncate">${safeName}</h3>
                            ${safeAlias ? `<p class="text-sm text-green-600"><i class="fas fa-tag mr-1"></i>@${safeAlias}</p>` : ''}
                            ${safeJabatan ? `<p class="text-sm text-purple-600"><i class="fas fa-briefcase mr-1"></i>${safeJabatan}</p>` : ''}
                            <p class="text-sm text-gray-500 break-all mt-1">${escapeHtml(u.email || '-')}</p>
                            ${u.phone ? `<p class="text-sm text-gray-500 mt-1"><i class="fas fa-phone mr-1"></i>${u.phone}</p>` : ''}
                        </div>
                        <div class="flex flex-col items-end gap-1 ml-2 flex-shrink-0">
                            ${getRoleBadge(u.role)}
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${u.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${u.is_active ? 'Aktif' : 'Nonaktif'}
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                        <span class="text-xs text-gray-500">Artikel:</span>
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${ac > 0 ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'}">
                            <i class="fas fa-newspaper mr-1"></i>${ac} artikel
                        </span>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-2 mt-3 pt-3 border-t border-gray-100">
                        <button onclick="toggleUserStatus('${u.id}', ${!u.is_active})" 
                            class="py-2.5 rounded-lg text-sm font-medium ${u.is_active ? 'bg-yellow-100 text-yellow-800 hover:bg-yellow-200' : 'bg-green-100 text-green-800 hover:bg-green-200'} transition"
                            title="${u.is_active ? 'Nonaktifkan' : 'Aktifkan'}">
                            <i class="fas fa-${u.is_active ? 'ban' : 'check-circle'}"></i>
                        </button>
                        <button onclick="editUser('${u.id}')" 
                            class="py-2.5 rounded-lg text-sm font-medium bg-blue-100 text-blue-800 hover:bg-blue-200 transition"
                            title="Edit User">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="changePassword('${u.id}', '${safeName}')" 
                            class="py-2.5 rounded-lg text-sm font-medium bg-purple-100 text-purple-800 hover:bg-purple-200 transition"
                            title="Ganti Password">
                            <i class="fas fa-key"></i>
                        </button>
                        <button onclick="deleteUser('${u.id}', '${safeName}')" 
                            class="py-2.5 rounded-lg text-sm font-medium bg-red-100 text-red-800 hover:bg-red-200 transition"
                            title="Hapus User">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }
        
        // =============================================
        // 🔑 GANTI PASSWORD (VIA EDGE FUNCTION)
        // =============================================
        window.changePassword = async function(userId, userName) {
            const { value: newPassword } = await Swal.fire({
                title: '🔑 Ganti Password',
                html: `
                    <div class="text-left">
                        <p class="mb-3 text-gray-600">User: <strong class="text-purple-600">${escapeHtml(userName)}</strong></p>
                        <div class="relative">
                            <input type="password" id="swalNewPassword" 
                                class="swal2-input w-full" 
                                placeholder="Masukkan password baru" 
                                minlength="6" 
                                autocomplete="new-password"
                                style="font-size: 16px; padding: 12px;">
                            <button type="button" onclick="
                                const inp = document.getElementById('swalNewPassword');
                                inp.type = inp.type === 'password' ? 'text' : 'password';
                                this.innerHTML = inp.type === 'password' ? '<i class=\\'fas fa-eye\\'></i>' : '<i class=\\'fas fa-eye-slash\\'></i>';
                            " class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <p class="text-xs text-gray-400 mt-2">Minimal 6 karakter</p>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-key mr-1"></i> Ganti Password',
                confirmButtonColor: '#8b5cf6',
                cancelButtonText: 'Batal',
                cancelButtonColor: '#6b7280',
                preConfirm: () => {
                    const pw = document.getElementById('swalNewPassword').value;
                    if (!pw || pw.length < 6) {
                        Swal.showValidationMessage('Password minimal 6 karakter');
                        return false;
                    }
                    return pw;
                }
            });
            
            if (!newPassword) return;
            
            // Loading
            Swal.fire({
                title: 'Mengganti password...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            
            try {
                await callResetPasswordAPI(userId, newPassword);
                
                Swal.fire({
                    icon: 'success',
                    title: '✅ Berhasil!',
                    html: `
                        <div class="text-left">
                            <p class="mb-2">Password untuk <strong>${escapeHtml(userName)}</strong> berhasil diganti.</p>
                            <div class="bg-green-50 border border-green-200 rounded-lg p-4 mt-3">
                                <p class="text-sm text-green-800 mb-1">Password baru:</p>
                                <p class="text-lg font-mono font-bold text-green-900 bg-white px-3 py-2 rounded border border-green-300 select-all">${escapeHtml(newPassword)}</p>
                            </div>
                            <p class="text-xs text-gray-400 mt-2">⚠️ Simpan password ini, tidak bisa dilihat lagi nanti.</p>
                        </div>
                    `,
                    timer: 10000,
                    showConfirmButton: true,
                    confirmButtonText: 'Tutup'
                });
                
            } catch (e) {
                console.error('Change password error:', e);
                Swal.fire({
                    icon: 'error',
                    title: '❌ Gagal',
                    text: e.message || 'Tidak bisa mengganti password',
                    footer: '<small class="text-gray-400">Pastikan Edge Function sudah ter-deploy dan session admin masih aktif</small>'
                });
                await restoreAdminSession();
            }
        };
        
        // =============================================
        // CRUD OPERATIONS
        // =============================================
        window.refreshData = async () => { 
            const btn = document.getElementById('refreshBtn');
            const icon = btn.querySelector('i');
            icon.classList.add('fa-spin');
            btn.disabled = true;
            await loadUsers();
            icon.classList.remove('fa-spin');
            btn.disabled = false; 
        };
        
        window.toggleUserStatus = async (id, newStatus) => { 
            try {
                await supabase.from('profiles').update({ is_active: newStatus }).eq('id', id);
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: `User ${newStatus ? 'diaktifkan' : 'dinonaktifkan'}`,
                    timer: 1500,
                    showConfirmButton: false
                });
                await loadUsers();
            } catch(e) {
                Swal.fire({ icon: 'error', title: 'Gagal', text: e.message });
            } 
        };
        
        window.submitUser = async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('userFullName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const alias = document.getElementById('userAlias').value.trim();
            const jabatan = document.getElementById('userJabatan').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const role = document.getElementById('userRole').value;
            const isActive = document.getElementById('userIsActive').value === 'true';
            const password = document.getElementById('userPassword').value;
            
            if (!fullName || !email) {
                Swal.fire({ icon: 'warning', title: 'Lengkapi Form', text: 'Nama dan Email wajib diisi' });
                return;
            }
            
            try {
                if (currentEditId) {
                    // UPDATE USER
                    const updateData = {
                        full_name: fullName,
                        email: email,
                        phone: phone || null,
                        role: role,
                        is_active: isActive,
                        alias: alias || null,
                        jabatan: jabatan || null
                    };
                    
                    await supabase.from('profiles').update(updateData).eq('id', currentEditId);
                    
                    // Kalau ada password baru, ganti password via Edge Function
                    if (password && password.length >= 6) {
                        try {
                            await callResetPasswordAPI(currentEditId, password);
                        } catch (pwError) {
                            console.warn('Gagal update password:', pwError);
                        }
                    }
                    
                    Swal.fire({
                        icon: 'success',
                        title: '✅ Diupdate!',
                        text: 'Data user berhasil diperbarui',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    
                } else {
                    // CREATE NEW USER
                    if (!password || password.length < 6) {
                        throw new Error('Password minimal 6 karakter');
                    }
                    
                    const { data: { session: adminSession } } = await supabase.auth.getSession();
                    
                    const { data: authData, error: signUpError } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                full_name: fullName,
                                phone: phone,
                                role: role,
                                alias: alias || null,
                                jabatan: jabatan || null
                            }
                        }
                    });
                    
                    if (signUpError) throw signUpError;
                    
                    // Kembalikan session admin
                    if (adminSession) {
                        await supabase.auth.setSession({
                            access_token: adminSession.access_token,
                            refresh_token: adminSession.refresh_token
                        });
                    }
                    
                    // Update profile tambahan setelah user dibuat
                    if (authData.user) {
                        await new Promise(resolve => setTimeout(resolve, 800));
                        await supabase.from('profiles').update({
                            is_active: isActive,
                            alias: alias || null,
                            jabatan: jabatan || null
                        }).eq('id', authData.user.id);
                    }
                    
                    Swal.fire({
                        icon: 'success',
                        title: '✅ Ditambahkan!',
                        html: `
                            <div class="text-left">
                                <p class="mb-2">User berhasil dibuat:</p>
                                <table class="w-full text-sm">
                                    <tr><td class="pr-4 py-1 text-gray-500">Email</td><td class="font-medium">${escapeHtml(email)}</td></tr>
                                    <tr><td class="pr-4 py-1 text-gray-500">Password</td><td class="font-mono font-bold">${escapeHtml(password)}</td></tr>
                                    <tr><td class="pr-4 py-1 text-gray-500">Role</td><td>${escapeHtml(role)}</td></tr>
                                </table>
                                <p class="text-xs text-red-500 mt-2">⚠️ Simpan password ini, tidak bisa dilihat lagi!</p>
                            </div>
                        `,
                        timer: 10000,
                        showConfirmButton: true
                    });
                }
                
                resetForm();
                await loadUsers();
                
            } catch(e) {
                console.error('Submit user error:', e);
                Swal.fire({ icon: 'error', title: 'Gagal', text: e.message });
                await restoreAdminSession();
            }
        };
        
        window.editUser = (id) => { 
            const u = currentUsers.find(x => x.id === id);
            if (!u) return;
            
            currentEditId = u.id;
            document.getElementById('userFullName').value = u.full_name || '';
            document.getElementById('userEmail').value = u.email || '';
            document.getElementById('userAlias').value = u.alias || '';
            document.getElementById('userJabatan').value = u.jabatan || '';
            document.getElementById('userPhone').value = u.phone || '';
            document.getElementById('userRole').value = u.role || 'user';
            document.getElementById('userIsActive').value = u.is_active ? 'true' : 'false';
            document.getElementById('userPassword').value = '';
            document.getElementById('userPassword').placeholder = 'Isi untuk ganti password (opsional)';
            document.getElementById('userPassword').required = false;
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit text-purple-600 mr-2"></i>Edit User';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save mr-1"></i> Update';
            document.getElementById('userForm').scrollIntoView({ behavior: 'smooth' });
        };
        
        window.deleteUser = async (id, name) => { 
            const result = await Swal.fire({
                title: '⚠️ Hapus User?',
                html: `
                    <div class="text-left">
                        <p>User <strong class="text-red-600">"${escapeHtml(name)}"</strong> akan dihapus <span class="text-red-600 font-bold">PERMANEN</span>!</p>
                        <p class="text-sm text-gray-400 mt-2">Semua data terkait (artikel, chat, log) juga akan terhapus.</p>
                    </div>
                `,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                confirmButtonText: '🗑️ Hapus Permanen',
                cancelButtonText: 'Batal'
            });
            
            if (!result.isConfirmed) return;
            
            try {
                const { error } = await supabase.rpc('admin_delete_user', { target_user_id: id });
                if (error) throw error;
                
                Swal.fire({ 
                    icon: 'success', 
                    title: '✅ Dihapus!', 
                    text: `User "${name}" berhasil dihapus`,
                    timer: 2000, 
                    showConfirmButton: false 
                });
                await loadUsers();
                if (currentEditId === id) resetForm();
            } catch(e) {
                console.error('Delete user error:', e);
                Swal.fire({ 
                    icon: 'error', 
                    title: 'Gagal', 
                    text: e.message.includes('Hanya admin') ? 'Tidak memiliki izin' : e.message 
                });
            } 
        };
        
        // =============================================
        // FORM RESET
        // =============================================
        window.resetForm = () => { 
            document.getElementById('userForm').reset();
            currentEditId = null;
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-user-plus text-purple-600 mr-2"></i>Tambah User Baru';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save mr-1"></i> Simpan';
            document.getElementById('userPassword').placeholder = 'Password (wajib)';
            document.getElementById('userPassword').required = true; 
        };
        
        // =============================================
        // LOGOUT
        // =============================================
        window.logout = async () => { 
            const result = await Swal.fire({
                title: 'Logout?',
                text: 'Anda akan keluar dari sesi admin',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Logout',
                cancelButtonText: 'Batal'
            });
            if (result.isConfirmed) {
                if (supabase) await supabase.auth.signOut();
                window.location.href = '../../auth/login.html';
            }
        };
        
        // =============================================
        // INIT
        // =============================================
        (async () => { 
            try {
                await initSupabase();
            } catch(e) {
                console.error('Init error:', e);
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Koneksi',
                    text: 'Tidak bisa terhubung ke server',
                    confirmButtonText: 'Login Ulang'
                }).then(() => window.location.href = '../../auth/login.html');
                return;
            }
            
            const session = await requireAdmin();
            if (session) {
                document.getElementById('adminEmail').textContent = session.user.email;
                await loadUsers();
            }
        })();
    </script>
</body>
</html>
