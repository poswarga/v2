<!-- Widget Input Papan POS WARGA (Untuk Dashboard) -->
<div class="papan-input-container">
  <h4 class="text-sm font-semibold text-gray-700 mb-2">
    ✏️ Kirim Pesan ke Papan POS WARGA
  </h4>
  
  <div class="relative">
    <textarea 
      id="papanMessage" 
      class="w-full p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
      placeholder="Tulis pesan singkat (maks 280 karakter)..."
      maxlength="280"
      rows="2"
    ></textarea>
    <div class="flex justify-between items-center mt-1">
      <span id="charCount" class="text-xs text-gray-400">0/280</span>
      <button 
        id="btnKirimPapan" 
        class="bg-red-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-red-700 disabled:opacity-50"
        disabled
      >
        <i class="fas fa-paper-plane"></i> Kirim
      </button>
    </div>
  </div>
  
  <div id="kirimStatus" class="mt-2 text-xs"></div>
</div>
