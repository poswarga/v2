<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Tutorial & Informasi - POS WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .accordion-item { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; transition: all 0.3s ease; }
        .accordion-header { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: white; transition: all 0.2s; }
        .accordion-header:hover { background: #f9fafb; }
        .accordion-header.active { background: #ecfdf5; border-bottom: 1px solid #d1fae5; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.4s ease; background: white; }
        .accordion-content.open { max-height: 5000px; padding: 20px; }
        .role-tab { transition: all 0.2s ease; }
        .role-tab.active { background: #2563eb; color: white; }
        .prose img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
        .prose h1, .prose h2, .prose h3 { margin: 16px 0 8px; }
        .prose p { margin-bottom: 12px; line-height: 1.7; }
        .prose ul, .prose ol { margin-left: 20px; margin-bottom: 12px; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">

<header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-gray-100">
    <div class="container mx-auto px-4 py-3">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-green-600 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-newspaper text-white"></i>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-red-600 to-green-600 bg-clip-text text-transparent">POS WARGA</span>
                </a>
            </div>
            <a href="index.html" class="text-gray-500 hover:text-red-600 p-2"><i class="fas fa-home text-lg"></i></a>
        </div>
    </div>
</header>

<section class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-12">
    <div class="container mx-auto px-4 text-center">
        <h1 class="text-3xl md:text-4xl font-bold mb-3">📚 Tutorial & Informasi</h1>
        <p class="text-emerald-100">Panduan penggunaan & Informasi<br>POS WARGA</p>
    </div>
</section>

<main class="container mx-auto px-4 py-8">
    <!-- Role Tabs -->
    <div class="flex flex-wrap gap-2 mb-6 justify-center" id="roleTabs">
        <button class="role-tab px-5 py-2.5 rounded-full text-sm font-medium bg-gray-100 text-gray-600 active" data-role="user">
            <i class="fas fa-user mr-1"></i> User
        </button>
        <button class="role-tab px-5 py-2.5 rounded-full text-sm font-medium bg-gray-100 text-gray-600" data-role="member">
            <i class="fas fa-star mr-1"></i> Member
        </button>
        <button class="role-tab px-5 py-2.5 rounded-full text-sm font-medium bg-gray-100 text-gray-600" data-role="editor">
            <i class="fas fa-pen-fancy mr-1"></i> Editor
        </button>
        <button class="role-tab px-5 py-2.5 rounded-full text-sm font-medium bg-gray-100 text-gray-600" data-role="admin">
            <i class="fas fa-crown mr-1"></i> Admin
        </button>
    </div>

    <!-- Accordion -->
    <div class="max-w-4xl mx-auto space-y-3" id="accordionContainer">
        <div class="text-center py-12 text-gray-500">
            <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
            <p>Memuat tutorial...</p>
        </div>
    </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const API_URL = 'https://api.poswarga.com/api/config';
let supabase = null, currentRole = 'user';

// ========== AUTH CHECK: LOGIN REQUIRED ==========
async function checkLoginAccess() {
    try {
        const configRes = await fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (!configRes.ok) throw new Error('Config error');
        const config = await configRes.json();
        
        const tempSupabase = createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
        const { data: { session } } = await tempSupabase.auth.getSession();
        
        if (!session) {
            window.location.href = 'auth/login.html';
            return false;
        }
        
        return true;
    } catch (e) {
        window.location.href = 'auth/login.html';
        return false;
    }
}

// ========== JALANKAN AUTH CHECK DULU ==========
const isLoggedIn = await checkLoginAccess();
if (!isLoggedIn) throw new Error('Akses ditolak');

async function initSupabase() {
    const r = await fetch(API_URL);
    const c = await r.json();
    supabase = createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
}

async function loadTutorials(role) {
    const container = document.getElementById('accordionContainer');
    container.innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-3xl mb-3"></i><p>Memuat tutorial...</p></div>';

    const { data, error } = await supabase
        .from('tutorials')
        .select('*')
        .eq('role', role)
        .eq('status', 'published')
        .order('order_index', { ascending: true });

    if (error || !data?.length) {
        container.innerHTML = `
            <div class="text-center py-12 text-gray-500">
                <i class="fas fa-book-open text-5xl mb-4 opacity-20"></i>
                <p class="text-lg">Belum ada tutorial untuk role ini</p>
                <p class="text-sm text-gray-400 mt-1">Tutorial akan muncul di sini setelah dipublish oleh admin.</p>
            </div>`;
        return;
    }

    container.innerHTML = data.map((t, i) => `
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)" data-index="${i}">
                <div>
                    <h3 class="font-semibold text-gray-800">${escapeHtml(t.title)}</h3>
                    ${t.excerpt ? `<p class="text-xs text-gray-400 mt-1">${escapeHtml(t.excerpt)}</p>` : ''}
                </div>
                <i class="fas fa-chevron-down text-gray-400 transition-transform" id="icon-${i}"></i>
            </div>
            <div class="accordion-content" id="content-${i}">
                <div class="prose max-w-none">${t.content}</div>
            </div>
        </div>
    `).join('');
}

function escapeHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

window.toggleAccordion = function(header) {
    const content = header.nextElementSibling;
    const icon = header.querySelector('i');
    const isOpen = content.classList.contains('open');
    
    // Tutup semua
    document.querySelectorAll('.accordion-content.open').forEach(c => c.classList.remove('open'));
    document.querySelectorAll('.accordion-header.active').forEach(h => h.classList.remove('active'));
    document.querySelectorAll('.accordion-header i').forEach(i => i.style.transform = 'rotate(0deg)');
    
    // Buka yang diklik (jika sebelumnya tidak terbuka)
    if (!isOpen) {
        content.classList.add('open');
        header.classList.add('active');
        icon.style.transform = 'rotate(180deg)';
    }
};

// Role tabs
document.querySelectorAll('#roleTabs .role-tab').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('#roleTabs .role-tab').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentRole = this.dataset.role;
        loadTutorials(currentRole);
    });
});

// Check URL param
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('role')) {
    currentRole = urlParams.get('role');
    document.querySelectorAll('#roleTabs .role-tab').forEach(b => {
        b.classList.toggle('active', b.dataset.role === currentRole);
    });
}

(async () => {
    await initSupabase();
    loadTutorials(currentRole);
})();
</script>
</body>
</html>
